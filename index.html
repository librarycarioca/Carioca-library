<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
<style>

:root{
  --green:#173b32;
  --green-dark:#0d2922;
  --green-soft:#31594e;
  --cream:#eee9df;
  --paper:#faf8f2;
  --white:#fffdf8;
  --ink:#1c2521;
  --muted:#737973;
  --line:#d9d4c8;
  --gold:#a18b62;
  --terra:#a5654d;
  --shadow:0 18px 45px rgba(27,43,37,.08);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:"DM Sans",sans-serif;
  line-height:1.5;
}

/* =========================
   HEADER
========================= */

header{
  height:78px;
  padding:0 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;

  background:rgba(250,248,242,.96);
  border-bottom:1px solid rgba(23,59,50,.14);

  position:sticky;
  top:0;
  z-index:100;

  backdrop-filter:blur(14px);
}

.logo{
  font-family:"Bodoni Moda",serif;
  font-size:25px;
  font-weight:500;
  letter-spacing:-.02em;
  color:var(--green);
}

nav{
  display:flex;
  align-items:center;
  gap:10px;
}

button{
  font:inherit;
  cursor:pointer;
}

.btn{
  border:1px solid var(--green);
  background:var(--green);
  color:#fff;
  padding:11px 18px;
  border-radius:2px;
  font-size:13px;
  letter-spacing:.01em;
  transition:
    background .2s ease,
    border-color .2s ease,
    transform .2s ease;
}

.btn:hover{
  background:var(--green-dark);
  border-color:var(--green-dark);
  transform:translateY(-1px);
}

.btn.secondary{
  background:transparent;
  color:var(--green);
  border-color:rgba(23,59,50,.4);
}

.btn.secondary:hover{
  background:var(--green);
  color:#fff;
}

.btn.danger{
  background:#814a3a;
  border-color:#814a3a;
}

.btn.danger:hover{
  background:#633428;
  border-color:#633428;
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed;
  transform:none;
}

/* =========================
   MAIN
========================= */

main{
  width:min(1240px,100%);
  margin:auto;
  padding:0 5.5% 90px;
}

/* =========================
   HERO
========================= */

.hero{
  min-height:510px;
  padding:85px 7% 80px;

  display:flex;
  flex-direction:column;
  justify-content:center;

  position:relative;
  overflow:hidden;

  border-bottom:1px solid var(--line);

  background:
    linear-gradient(
      90deg,
      rgba(250,248,242,.98) 0%,
      rgba(250,248,242,.92) 42%,
      rgba(250,248,242,.58) 72%,
      rgba(250,248,242,.18) 100%
    ),
    url("https://images.unsplash.com/photo-1521587760476-6c12a4b040da?auto=format&fit=crop&w=2200&q=90")
    center/cover no-repeat;
}

.hero::after{
  content:"";
  position:absolute;
  right:7%;
  bottom:45px;

  width:110px;
  height:1px;

  background:var(--gold);
}

.eyebrow{
  position:relative;
  z-index:1;

  margin-bottom:18px;

  font-size:11px;
  font-weight:600;
  letter-spacing:.2em;
  text-transform:uppercase;

  color:var(--terra);
}

h1{
  position:relative;
  z-index:1;

  max-width:780px;
  margin:0;

  font-family:"Bodoni Moda",serif;
  font-size:clamp(54px,8vw,94px);
  font-weight:500;
  line-height:.93;
  letter-spacing:-.045em;

  color:var(--green);
}

.hero p{
  position:relative;
  z-index:1;

  max-width:500px;
  margin:28px 0 0;

  color:#5f6863;
  font-size:16px;
  line-height:1.8;
}

/* =========================
   SECTIONS
========================= */

section{
  padding-top:68px;
}

.section-title{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;

  margin-bottom:25px;
}

.section-title h2{
  margin:0;

  font-family:"Bodoni Moda",serif;
  font-size:39px;
  font-weight:500;
  letter-spacing:-.025em;
  color:var(--green);
}

.section-title::after{
  content:"";
  flex:1;
  height:1px;
  margin:0 0 8px 25px;
  background:var(--line);
}

/* =========================
   SEARCH
========================= */

.toolbar{
  display:grid;
  grid-template-columns:minmax(0,1fr) 250px;
  gap:12px;
  margin:0 0 30px;
}

input,
select,
textarea{
  width:100%;
  padding:13px 15px;

  border:1px solid var(--line);
  border-radius:2px;

  background:rgba(255,253,248,.85);
  color:var(--ink);

  font:inherit;
  font-size:14px;

  outline:none;

  transition:
    border-color .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--green-soft);
  background:#fff;
  box-shadow:0 0 0 3px rgba(23,59,50,.07);
}

/* =========================
   BOOK GRID
========================= */

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(245px,1fr));
  gap:18px;
}

.card{
  min-height:245px;
  padding:25px;

  display:flex;
  flex-direction:column;
  justify-content:space-between;

  position:relative;

  background:var(--paper);
  border:1px solid var(--line);

  box-shadow:0 4px 18px rgba(30,45,39,.025);

  transition:
    transform .25s ease,
    box-shadow .25s ease,
    border-color .25s ease;
}

.card::before{
  content:"";
  position:absolute;
  top:0;
  left:25px;

  width:28px;
  height:2px;

  background:var(--gold);
}

.card:hover{
  transform:translateY(-4px);
  border-color:#c9c3b6;
  box-shadow:var(--shadow);
}

.card h3{
  margin:10px 0 9px;

  font-family:"Bodoni Moda",serif;
  font-size:25px;
  font-weight:500;
  line-height:1.15;
  letter-spacing:-.02em;

  color:var(--green);
}

.meta{
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
}

.card .btn{
  margin-top:20px;
}

/* =========================
   PANELS
========================= */

.panel{
  padding:30px;

  background:var(--paper);
  border:1px solid var(--line);

  box-shadow:0 8px 25px rgba(30,45,39,.035);
}

.panel h3{
  margin:0 0 24px;

  font-family:"Bodoni Moda",serif;
  font-size:25px;
  font-weight:500;
  color:var(--green);
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  display:block;
  color:#4f5954;
  font-size:12px;
  font-weight:500;
  letter-spacing:.02em;
}

.actions{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  margin-top:20px;
}

/* =========================
   MESSAGES
========================= */

.msg{
  padding:13px 15px;
  margin:12px 0;

  border-left:2px solid var(--gold);

  background:#e8e2d6;

  font-size:13px;
}

.msg.error{
  background:#f0ddd6;
  border-left-color:var(--terra);
  color:#713b2a;
}

.msg.ok{
  background:#dfe9e2;
  border-left-color:var(--green);
  color:#234d3d;
}

/* =========================
   ADMIN
========================= */

.admin{
  margin-top:75px;
  padding-top:60px;

  border-top:1px solid var(--line);
}

.admin .panel{
  margin-top:20px;
}

.admin-book{
  padding:24px 0;
  border-bottom:1px solid var(--line);
}

.admin-book:last-child{
  border-bottom:0;
}

.admin-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.admin-book strong{
  color:var(--green);
}

.badge{
  display:inline-block;

  padding:5px 9px;
  margin:8px 5px 0 0;

  border:1px solid #d4d8d1;
  border-radius:20px;

  background:#edf0eb;
  color:var(--green);

  font-size:11px;
}

.badge.borrowed{
  background:#f0ddd5;
  border-color:#e2c4b8;
  color:#713b2a;
}

.copy-list{
  margin-top:14px;
  padding-left:20px;
}

.copy-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;

  padding:12px 0;

  border-top:1px solid #e5e1d8;

  font-size:13px;
}

.copy-item small{
  color:var(--muted);
}

/* =========================
   TABLE
========================= */

table{
  width:100%;
  border-collapse:collapse;
  background:var(--paper);
}

th,
td{
  padding:14px;
  text-align:left;
  border-bottom:1px solid var(--line);
  font-size:13px;
}

th{
  color:var(--green);
  font-weight:600;
}

/* =========================
   MODALS
========================= */

.modal{
  position:fixed;
  inset:0;

  display:none;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(13,35,29,.68);

  backdrop-filter:blur(5px);

  z-index:300;
}

.modal.open{
  display:flex;
}

.modalbox{
  width:min(470px,100%);
  max-height:90vh;
  overflow:auto;

  padding:34px;

  background:var(--paper);
  border:1px solid #d3cec2;

  box-shadow:0 25px 70px rgba(0,0,0,.2);
}

.modalbox h2{
  margin:0 0 24px;

  font-family:"Bodoni Moda",serif;
  font-size:37px;
  font-weight:500;
  line-height:1;

  color:var(--green);
}

.link{
  padding:0;

  border:0;
  background:none;

  color:var(--green);

  font-size:13px;
  text-decoration:none;

  cursor:pointer;
}

.link:hover{
  text-decoration:underline;
}

/* =========================
   FOOTER
========================= */

footer{
  padding:35px 6%;

  border-top:1px solid var(--line);

  background:#e8e3d9;

  color:#737973;

  font-size:12px;
  letter-spacing:.02em;
}

/* =========================
   HIDDEN
========================= */

.hidden{
  display:none!important;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  header{

  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

<body>

<header>

  <div class="logo">
    Carioca Library
  </div>

  <nav>

    <button
      class="btn secondary hide-mobile"
      id="userLabel"
      type="button"
    >
      Visitante
    </button>

    <button
      class="btn"
      id="loginBtn"
      type="button"
    >
      Entrar
    </button>

    <button
      class="btn hidden"
      id="logoutBtn"
      type="button"
    >
      Sair
    </button>

  </nav>

</header>


<main>

<section class="hero">

  <div class="eyebrow">
    Acervo da JOCUM Carioca
  </div>

  <h1>
    Ler, aprender e servir.
  </h1>

  <p>
    Um espaço para encontrar histórias,
    conhecimento e recursos.
  </p>

</section>


<section>

  <div class="section-title">

    <h2>
      Acervo
    </h2>

  </div>


  <div class="toolbar">

    <input
      id="search"
      placeholder="Buscar por título ou autor..."
    >

    <select id="categoryFilter">

      <option value="">
        Todas as coleções
      </option>

    </select>

  </div>


  <div id="status"></div>

  <div
    id="books"
    class="grid"
  ></div>

</section>


<section
  id="myArea"
  class="hidden"
>

  <div class="section-title">

    <h2>
      Meus empréstimos
    </h2>

  </div>

  <div
    id="myLoans"
    class="grid"
  ></div>

</section>


<section
  id="adminArea"
  class="admin hidden"
>

  <div class="section-title">

    <h2>
      Administração
    </h2>

  </div>

  <div id="adminStatus"></div>


  <div class="panel">

    <h3>
      Adicionar livro
    </h3>

    <form id="bookForm">

      <div class="form-grid">

        <div class="field">

          <label>
            Título<br>

            <input
              id="title"
              required
            >

          </label>

        </div>


        <div class="field">

          <label>

async function availableCount(
  bookId
){

  const {
    count,
    error
  } =
  await db
    .from("book_copies")
    .select(
      "id",
      {
        count:"exact",
        head:true
      }
    )
    .eq(
      "book_id",
      bookId
    )
    .eq(
      "status",
      "available"
    );


  if(error){

    console.error(
      error
    );

    return 0;

  }


  return count || 0;

}


async function renderBooks(){

  const term =
    $("search")
      .value
      .trim()
      .toLowerCase();


  const cat =
    $("categoryFilter")
      .value;


  const list =
    books.filter(
      b =>
      (
        !term ||
        `${b.title} ${b.author || ""}`
          .toLowerCase()
          .includes(term)
      )
      &&
      (
        !cat ||
        String(b.category_id) ===
        String(cat)
      )
    );


  if(!list.length){

    $("books").innerHTML =
      `
        <div class="panel">
          Nenhum livro encontrado.
        </div>
      `;

    return;

  }


  $("books").innerHTML =
    list
      .map(
        b =>
        `
          <article class="card">

            <div>

              <div class="meta">
                ${esc(
                  b.categories?.name ||
                  "Acervo"
                )}
              </div>

              <h3>
                ${esc(b.title)}
              </h3>

              <div class="meta">
                ${esc(
                  b.author ||
                  "Autor não informado"
                )}
              </div>

              <div
                class="meta"
                id="count-${b.id}"
                style="margin-top:12px"
              >
                Verificando exemplares...
              </div>

            </div>

            <div
              id="action-${b.id}"
            ></div>

          </article>
        `
      )
      .join("");


  await Promise.all(

    list.map(
      async b => {

        const n =
          await availableCount(
            b.id
          );


        const ce =
          $("count-" + b.id);

        const ae =
          $("action-" + b.id);


        if(ce){

          ce.textContent =
            n
              ? `${n} exemplar${
                  n === 1
                    ? ""
                    : "es"
                } disponível${
                  n === 1
                    ? ""
                    : "is"
                }`
              : "Nenhum exemplar disponível";

        }


        if(!ae){

          return;

        }


        if(
          user &&
          n > 0
        ){

          ae.innerHTML =
            `
              <button
                class="btn"
                type="button"
                onclick="borrowBook('${b.id}')"
              >
                Quero emprestar
              </button>
            `;

        }

        else if(user){

          ae.innerHTML =
            `
              <button
                class="btn secondary"
                type="button"
                disabled
              >
                Indisponível
              </button>
            `;

        }

        else{

          ae.innerHTML =
            `
              <button
                class="btn secondary"
                type="button"
                onclick="openAuth()"
              >
                Entrar para emprestar
              </button>
            `;

        }

      }
    )

  );

}


/*
 * ==========================================================
 * EMPRÉSTIMO
 *
 * CORREÇÃO:
 * O ID dos seus livros é numérico.
 * Por isso enviamos Number(bookId).
 *
 * Isso faz a chamada chegar na versão
 * borrow_book(bigint), em vez de tentar
 * interpretar "2" como UUID.
 * ==========================================================
 */

async function borrowBook(
  bookId
){

  if(!user){

    openAuth();

    return;

  }


  showStatus(
    "Registrando empréstimo..."
  );


  const {
    data,
    error
  } =
  await db.rpc(
    "borrow_book",
    {
      p_book_id:
        Number(bookId)
    }
  );


  if(error){

    showStatus(
      "Não foi possível registrar o empréstimo: " +
      error.message,
      "error"
    );

    return;

  }


  showStatus(
    "Empréstimo registrado. O exemplar deve ser retirado com a administração.",
    "ok"
  );


  await loadBooks();

  await loadMyLoans();


  if(isAdmin()){

    await loadAdminBooks();

  }

}

                  Exemplar:

}


async function saveBook(
  e
){

  e.preventDefault();


  if(!isAdmin()){

    showAdminStatus(
      "Você não tem permissão de administrador.",
      "error"
    );

    return;

  }


  const quantity =
    Math.max(
      1,
      parseInt(
        $("quantity").value,
        10
      ) || 1
    );


  $("saveBookBtn")
    .disabled =
    true;

  $("saveBookBtn")
    .textContent =
    "Cadastrando...";


  try{

    const {
      data,
      error
    } =
    await db.rpc(
      "create_book_with_copies",
      {

        p_title:
          $("title")
            .value
            .trim(),

        p_author:
          $("author")
            .value
            .trim() ||
          null,

        p_isbn:
          $("isbn")
            .value
            .trim() ||
          null,

        p_edition:
          $("edition")
            .value
            .trim() ||
          null,

        p_publication_year:
          $("year").value
            ?
            Number(
              $("year").value
            )
            :
            null,

        p_description:
          $("description")
            .value
            .trim() ||
          null,

        p_category_id:
          $("category").value ||
          null,

        p_quantity:
          quantity

      }
    );


    if(error){

      throw error;

    }


    $("bookForm")
      .reset();


    $("quantity")
      .value =
      1;


    showAdminStatus(
      `Livro cadastrado com ${quantity} exemplar${
        quantity === 1
          ? ""
          : "es"
      }.`,
      "ok"
    );


    await loadBooks();

    await loadAdminBooks();

  }

  catch(err){

    showAdminStatus(
      err.message ||
      "Erro ao cadastrar livro.",
      "error"
    );

  }

  finally{

    $("saveBookBtn")
      .disabled =
      false;

    $("saveBookBtn")
      .textContent =
      "Cadastrar livro";

  }

}


async function loadAdminBooks(){

  if(!isAdmin()){

    return;

  }


  const {
    data,
    error
  } =
  await db
    .from("books")
    .select(
      "id,title,author,categories(name),book_copies(id,inventory_code,status)"
    )
    .order(
      "title"
    );


  if(error){

    $("adminBooks").innerHTML =
      `
        <div class="msg error">
          ${esc(error.message)}
        </div>
      `;

    return;

  }


  const ids =
    (data || [])
      .flatMap(
        b =>
          (b.book_copies || [])
            .filter(
              c =>
                c.status ===
                "borrowed"
            )
            .map(
              c =>
                c.id
            )
      );


  let loans = [];


  if(ids.length){

    const r =
      await db
        .from("loans")
        .select(
          "id,copy_id,user_id,due_date,borrowed_at,status,profiles(full_name,email)"
        )
        .in(
          "copy_id",
          ids
        )
        .eq(
          "status",
          "borrowed"
        );


    if(!r.error){

      loans =
        r.data || [];

    }

  }


  const loanByCopy =
    Object.fromEntries(
      loans.map(
        l =>
        [
          l.copy_id,
          l
        ]
      )
    );


  $("adminBooks").innerHTML =
    (data || []).length

      ?

      (data || [])
        .map(
          b => {

            const copies =
              b.book_copies ||
              [];


            const av =
              copies.filter(
                c =>
                  c.status ===
                  "available"
              ).length;


            const bor =
              copies.filter(
                c =>
                  c.status ===
                  "borrowed"
              ).length;


            return `
              <div class="admin-book">

                <div class="admin-row">

                  <div>

                    <strong>
                      ${esc(b.title)}
                    </strong>

                    <div class="meta">
                      ${esc(
                        b.author ||
                        "Autor não informado"
                      )}

                      ·

                      ${esc(
                        b.categories?.name ||
                        "Sem coleção"
                      )}
                    </div>

                    <div
                      style="margin-top:8px"
                    >

                      <span class="badge">
                        ${copies.length}
                        exemplar${
                          copies.length === 1
                            ? ""
                            : "es"
                        }
                      </span>

                      <span class="badge">
                        ${av}
                        disponível${
                          av === 1
                            ? ""
                            : "is"
                        }
                      </span>

                      ${
                        bor

                          ?

                          `
                            <span
                              class="badge borrowed"
                            >
                              ${bor}
                              emprestado${
                                bor === 1
                                  ? ""
                                  : "s"
                              }
                            </span>
                          `

                          :

                          ""
                      }

                    </div>

                  </div>


                  <button
                    class="btn danger"
                    type="button"
                    onclick="deleteBook('${b.id}')"
                  >
                    Excluir livro
                  </button>

                </div>


                <div class="copy-list">

                  ${
                    copies.length

                      ?

                      copies
                        .map(
                          c => {

                            const l =
                              loanByCopy[
                                c.id
                              ];


                            return `
                              <div
                                class="copy-item"
                              >

                                <div>

                                  <strong>
                                    ${esc(
                                      c.inventory_code
                                    )}
                                  </strong>

                                  <small>
                                    ·
                                    ${
                                      c.status ===
                                      "available"

                                        ? "Disponível"

                                        : "Emprestado"
                                    }
                                  </small>

                                  ${
                                    l

                                      ?

                                      `
                                        <br>

                                        <small>
                                          Com:
                                          ${esc(
                                            l.profiles?.full_name ||
                                            l.profiles?.email ||
                                            "usuário"
                                          )}

                                          · até

                                          ${esc(
                                            l.due_date ||
                                            "—"
                                          )}
                                        </small>
                                      `

                                      :

                                      ""
                                  }

                                </div>


                                ${
                                  c.status ===
                                  "borrowed"

                                    ?

                                    `
                                      <button
                                        class="btn secondary"
                                        type="button"
                                        onclick="adminReturn(
                                          '${c.id}',
                                          '${l?.id || ""}'
                                        )"
                                      >
                                        Confirmar devolução
                                      </button>
                                    `

                                    :

                                    ""
                                }

                              </div>
                            `;

                          }
                        )
                        .join("")

                      :

                      `
                        <div class="meta">
                          Nenhum exemplar cadastrado.
                        </div>
                      `
                  }

                </div>

              </div>
            `;

          }
        )
        .join("")

      :

      `
        <div class="panel">
          Nenhum livro cadastrado.
        </div>
      `;

}


async function adminReturn(
  copyId,
  loanId
){

  if(!isAdmin()){

    showAdminStatus(
      "Apenas administradores podem registrar devoluções.",
      "error"
    );

    return;

  }


  if(!loanId){

    showAdminStatus(
      "Não encontrei o empréstimo ativo deste exemplar.",
      "error"
    );

    return;

  }


  confirmBox(

    "Confirmar devolução",

    "Confirme somente depois que o livro físico tiver sido entregue à administração.",

    async () => {

      const {
        error
      } =
      await db.rpc(
        "admin_return_loan",
        {
          p_loan_id:
            Number(loanId)
        }
      );


      if(error){

        showAdminStatus(
          "Não foi possível registrar a devolução: " +
          error.message,
          "error"
        );

        return;

      }


      showAdminStatus(
        "Devolução confirmada. O exemplar está novamente disponível para empréstimo.",
        "ok"
      );


      await loadBooks();

      await loadAdminBooks();

    }

  );

}


async function deleteBook(
  bookId
){

  if(!isAdmin()){

    showAdminStatus(
      "Apenas administradores podem excluir livros.",
      "error"
    );

    return;

  }


  const {
    data:copies,
    error
  } =
  await db
    .from("book_copies")
    .select(
      "id,status"
    )
    .eq(
      "book_id",
      bookId
    );


  if(error){

    showAdminStatus(
      "Não consegui verificar os exemplares: " +
      error.message,
      "error"
    );

    return;

  }


  if(
    (copies || [])
      .some(
        c =>
          c.status ===
          "borrowed"
      )
  ){

    showAdminStatus(
      "Este livro não pode ser excluído enquanto houver exemplar emprestado. Primeiro registre a devolução.",
      "error"
    );

    return;

  }


  const {
    data:loans,
    error:loanError
  } =
  await db
    .from("loans")
    .select(
      "id,copy_id"
    )
    .in(
      "copy_id",
      (copies || [])
        .map(
          c =>
            c.id
        )
    );


  if(loanError){

    showAdminStatus(
      "Não consegui verificar o histórico: " +
      loanError.message,
      "error"
    );

    return;

  }


  if(
    (loans || [])
      .length
  ){

    showAdminStatus(
      "Este livro possui histórico de empréstimos e não será apagado para preservar o histórico da biblioteca.",
      "error"
    );

    return;

  }


  const book =
    books.find(
      b =>
        String(b.id) ===
        String(bookId)
    );


  confirmBox(

    "Excluir livro",

    `Excluir “${
      book?.title ||
      "este livro"
    }” e todos os exemplares ainda sem histórico? Esta ação não pode ser desfeita.`,

    async () => {

      const {
        error:ce
      } =
      await db
        .from("book_copies")
        .delete()
        .eq(
          "book_id",
          bookId
        );


      if(ce){

        showAdminStatus(
          "Não foi possível excluir os exemplares: " +
          ce.message,
          "error"
        );

        return;

      }


      const {
        error:be
      } =
      await db
        .from("books")
        .delete()
        .eq(
          "id",
          bookId
        );


      if(be){

        showAdminStatus(
          "Não foi possível excluir o livro: " +
          be.message,
          "error"
        );

        return;

      }


      showAdminStatus(
        "Livro excluído.",
        "ok"
      );


      await loadBooks();

      await loadAdminBooks();

    }

  );

}


function updateUI(){

  $("loginBtn")
    .classList
    .toggle(
      "hidden",
      !!user
    );


  $("logoutBtn")
    .classList
    .toggle(
      "hidden",
      !user
    );


  $("userLabel")
    .textContent =
    user
      ?
      (
        profile?.full_name ||
        user.email
      )
      :
      "Visitante";


  $("myArea")
    .classList
    .toggle(
      "hidden",
      !user
    );


  $("adminArea")
    .classList
    .toggle(
      "hidden",
      !isAdmin()
    );


  if(user){

    loadMyLoans();

  }


  if(isAdmin()){

    loadAdminBooks();

  }

}


async function authSubmit(
  e
){

  e.preventDefault();


  const email =
    $("email")
      .value
      .trim();


  const password =
    $("password")
      .value;


  const fullName =
    $("fullName")
      .value
      .trim();


  $("authSubmit")
    .disabled =
    true;


  message(
    $("authMsg"),
    ""
  );


  try{

    if(signupMode){

      const {
        data,
        error
      } =
      await db.auth.signUp({

        email,

        password,

        options:{
          data:{
            full_name:
              fullName
          }
        }

      });


      if(error){

        throw error;

      }


      if(!data.session){

        message(
          $("authMsg"),

          "Conta criada. Se a confirmação de e-mail estiver ativa no Supabase, confirme o e-mail antes de entrar.",

          "ok"
        );

      }

      else{

        closeAuth();

      }

    }

    else{

      const {
        error
      } =
      await db.auth
        .signInWithPassword({

          email,

          password

        });


      if(error){

        throw error;

      }


      closeAuth();

    }

  }

  catch(err){

    message(
      $("authMsg"),
      err.message ||
      "Erro ao entrar.",
      "error"
    );

  }

  finally{

    $("authSubmit")
      .disabled =
      false;


    $("authSubmit")
      .textContent =
      signupMode
        ? "Criar conta"
        : "Entrar";

  }

}


async function forgot(){

  const email =
    $("email")
      .value
      .trim();


  if(!email){

    message(
      $("authMsg"),
      "Digite seu e-mail primeiro.",
      "error"
    );

    return;

  }


  const {
    error
  } =
  await db.auth
    .resetPasswordForEmail(
      email,
      {
        redirectTo:
          location.origin +
          location.pathname
      }
    );


  if(error){

    message(
      $("authMsg"),
      error.message,
      "error"
    );

    return;

  }


  message(
    $("authMsg"),

    "Enviamos o link de recuperação para seu e-mail.",

    "ok"
  );

}


async function resetPassword(
  e
){

  e.preventDefault();


  const {
    error
  } =
  await db.auth
    .updateUser({
      password:
        $("newPassword")
          .value
    });


  if(error){

    message(
      $("resetMsg"),
      error.message,
      "error"
    );

    return;

  }


  message(
    $("resetMsg"),

    "Senha alterada. Agora você pode entrar.",

    "ok"
  );

}


async function logout(){

  await db.auth.signOut();

}

/*
 * A sessão é recuperada antes de carregar
 * o catálogo.
 */

db.auth.onAuthStateChange(
  (
    event,
    session
  ) => {

    setTimeout(
      async () => {

        user =
          session?.user ||
          null;


        if(user){

          await loadProfile();

        }

        else{

          profile =
            null;

        }


        updateUI();

        /*
         * Redesenha os livros depois do login
         * para mostrar "Quero emprestar".
         */

        await renderBooks();


        if(
          event ===
          "PASSWORD_RECOVERY"
        ){

          $("resetMsg")
            .innerHTML =
            "";

          $("resetModal")
            .classList
            .add("open");

        }

      },
      0
    );

  }
);


/*
 * INICIALIZAÇÃO
 *
 * Primeiro recupera a sessão.
 * Depois carrega categorias e livros.
 */

(async function start(){

  showStatus(
    "Carregando acervo..."
  );


  const {
    data
  } =
  await db.auth.getSession();


  user =
    data.session?.user ||
    null;


  if(user){

    await loadProfile();

  }


  await loadCategories();

  await loadBooks();

  updateUI();

  await renderBooks();

  showStatus("");


  if(
    location.hash.includes(
      "type=recovery"
    )
  ){

    $("resetModal")
      .classList
      .add("open");

  }

})();

</script>
