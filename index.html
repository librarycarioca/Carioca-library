<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carioca Library</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --green:#183b32;
  --green2:#245247;
  --cream:#f4f0e7;
  --paper:#fbfaf6;
  --ink:#18231f;
  --muted:#69726d;
  --line:#d8d4c9;
  --terra:#a9674d
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:"DM Sans",sans-serif
}

header{
  height:76px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  background:rgba(251,250,246,.94);
  position:sticky;
  top:0;
  z-index:10
}

.logo{
  font-family:"Bodoni Moda",serif;
  font-size:25px;
  color:var(--green)
}

nav{
  display:flex;
  gap:18px;
  align-items:center
}

button{
  font:inherit;
  cursor:pointer
}

.btn{
  border:0;
  background:var(--green);
  color:#fff;
  padding:11px 17px;
  border-radius:4px
}

.btn:hover{
  background:var(--green2)
}

.btn.secondary{
  background:transparent;
  color:var(--green);
  border:1px solid var(--green)
}

.btn.danger{
  background:#7b4030
}

.btn.danger:hover{
  background:#633225
}

.btn:disabled{
  opacity:.55;
  cursor:not-allowed
}

main{
  max-width:1180px;
  margin:auto;
  padding:0 5% 70px
}

.hero{
  padding:75px 0 55px;
  border-bottom:1px solid var(--line)
}

.eyebrow{
  letter-spacing:.16em;
  text-transform:uppercase;
  font-size:11px;
  color:var(--terra)
}

h1{
  font-family:"Bodoni Moda",serif;
  font-weight:500;
  font-size:clamp(48px,8vw,88px);
  line-height:.95;
  max-width:780px;
  margin:17px 0
}

.hero p{
  max-width:600px;
  color:var(--muted);
  font-size:17px;
  line-height:1.7
}

.toolbar{
  display:flex;
  gap:10px;
  margin:35px 0 25px
}

.toolbar input{
  flex:1
}

input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:4px;
  background:#fff;
  color:var(--ink);
  font:inherit
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:18px
}

.card{
  background:var(--paper);
  border:1px solid var(--line);
  padding:22px;
  min-height:190px;
  display:flex;
  flex-direction:column;
  justify-content:space-between
}

.card h3{
  font-family:"Bodoni Moda",serif;
  font-size:23px;
  font-weight:500;
  margin:0 0 8px
}

.meta{
  font-size:13px;
  color:var(--muted)
}

section{
  padding-top:45px
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:18px
}

.section-title h2{
  font-family:"Bodoni Moda",serif;
  font-weight:500;
  font-size:34px;
  margin:0
}

.hidden{
  display:none!important
}

.panel{
  background:var(--paper);
  border:1px solid var(--line);
  padding:25px;
  margin-top:20px
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px
}

.field.full{
  grid-column:1/-1
}

.msg{
  padding:12px 14px;
  margin:12px 0;
  border-radius:4px;
  font-size:14px;
  background:#eee9dc
}

.msg.error{
  background:#f3ddd6;
  color:#713b2a
}

.msg.ok{
  background:#dfece5;
  color:#234d3d
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(20,29,25,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:30
}

.modal.open{
  display:flex
}

.modalbox{
  background:var(--paper);
  width:min(470px,100%);
  padding:30px;
  border:1px solid var(--line);
  max-height:90vh;
  overflow:auto
}

.modalbox h2{
  font-family:"Bodoni Moda",serif;
  font-weight:500;
  font-size:34px;
  margin:0 0 20px
}

.actions{
  display:flex;
  gap:10px;
  margin-top:15px;
  align-items:center;
  flex-wrap:wrap
}

.link{
  border:0;
  background:none;
  color:var(--green);
  text-decoration:underline;
  padding:0
}

.admin{
  border-top:1px solid var(--line);
  margin-top:45px;
  padding-top:35px
}

.admin-book{
  padding:18px 0;
  border-bottom:1px solid var(--line)
}

.admin-book:last-child{
  border-bottom:0
}

.admin-row{
  display:flex;
  justify-content:space-between;
  gap:18px;
  align-items:center
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#e5e9e3;
  color:var(--green);
  font-size:12px;
  margin-right:5px
}

.badge.borrowed{
  background:#f0ddd5;
  color:#713b2a
}

.copy-list{
  margin-top:12px;
  padding-left:18px
}

.copy-item{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  padding:8px 0;
  border-top:1px solid #e5e1d8;
  font-size:13px
}

.copy-item small{
  color:var(--muted)
}

table{
  width:100%;
  border-collapse:collapse;
  background:var(--paper)
}

th,td{
  text-align:left;
  padding:13px;
  border-bottom:1px solid var(--line);
  font-size:14px
}

th{
  font-weight:600;
  color:var(--green)
}

footer{
  border-top:1px solid var(--line);
  padding:25px 6%;
  color:var(--muted);
  font-size:13px
}

@media(max-width:650px){
  header{
    padding:0 5%;
    height:68px
  }

  .logo{
    font-size:21px
  }

  nav .hide-mobile{
    display:none
  }

  .hero{
    padding:50px 0 40px
  }

  .form-grid{
    grid-template-columns:1fr
  }

  .field.full{
    grid-column:auto
  }

  .toolbar{
    flex-direction:column
  }

  .admin-row{
    align-items:flex-start;
    flex-direction:column
  }

  .copy-item{
    align-items:flex-start;
    flex-direction:column
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">Carioca Library</div>

  <nav>
    <button class="btn secondary hide-mobile" id="userLabel" type="button">
      Visitante
    </button>

    <button class="btn" id="loginBtn" type="button">
      Entrar
    </button>

    <button class="btn hidden" id="logoutBtn" type="button">
      Sair
    </button>
  </nav>
</header>

<main>

<section class="hero">
  <div class="eyebrow">Acervo da JOCUM Carioca</div>

  <h1>Ler, aprender e servir.</h1>

  <p>
    Um espaço para encontrar histórias, conhecimento e recursos.
  </p>
</section>


<section>

  <div class="section-title">
    <h2>Acervo</h2>
  </div>

  <div class="toolbar">

    <input
      id="search"
      placeholder="Buscar por título ou autor..."
    >

    <select id="categoryFilter">
      <option value="">Todas as coleções</option>
    </select>

  </div>

  <div id="status"></div>

  <div id="books" class="grid"></div>

</section>


<section id="myArea" class="hidden">

  <div class="section-title">
    <h2>Meus empréstimos</h2>
  </div>

  <div id="myLoans" class="grid"></div>

</section>


<section id="adminArea" class="admin hidden">

  <div class="section-title">
    <h2>Administração</h2>
  </div>

  <div id="adminStatus"></div>


  <div class="panel">

    <h3>Adicionar livro</h3>

    <form id="bookForm">

      <div class="form-grid">

        <div class="field">
          <label>
            Título<br>
            <input id="title" required>
          </label>
        </div>

        <div class="field">
          <label>
            Autor<br>
            <input id="author">
          </label>
        </div>

        <div class="field">
          <label>
            ISBN<br>
            <input id="isbn">
          </label>
        </div>

        <div class="field">
          <label>
            Edição<br>
            <input id="edition">
          </label>
        </div>

        <div class="field">
          <label>
            Ano<br>
            <input id="year" type="number">
          </label>
        </div>

        <div class="field">
          <label>
            Coleção<br>
            <select id="category"></select>
          </label>
        </div>

        <div class="field">
          <label>
            Quantidade de exemplares<br>
            <input
              id="quantity"
              type="number"
              min="1"
              value="1"
              required
            >
          </label>
        </div>

        <div class="field full">
          <label>
            Descrição<br>
            <textarea id="description" rows="4"></textarea>
          </label>
        </div>

      </div>

      <div class="actions">

        <button
          class="btn"
          id="saveBookBtn"
          type="submit"
        >
          Cadastrar livro
        </button>

      </div>

    </form>

  </div>


  <div class="panel">

    <h3>Livros cadastrados</h3>

    <div id="adminBooks"></div>

  </div>

</section>

</main>


<footer>
  Uma biblioteca para ler, aprender e servir.
</footer>


<!-- LOGIN -->

<div class="modal" id="authModal">

  <div class="modalbox">

    <h2 id="authTitle">Entrar</h2>

    <div id="authMsg"></div>

    <form id="authForm">

      <div id="nameField" class="hidden">

        <label>
          Nome<br>
          <input id="fullName">
        </label>

      </div>


      <div style="margin-top:12px">

        <label>
          E-mail<br>
          <input
            id="email"
            type="email"
            required
            autocomplete="email"
          >
        </label>

      </div>


      <div style="margin-top:12px">

        <label>
          Senha<br>
          <input
            id="password"
            type="password"
            required
            autocomplete="current-password"
          >
        </label>

      </div>


      <div class="actions">

        <button
          class="btn"
          id="authSubmit"
          type="submit"
        >
          Entrar
        </button>

        <button
          class="link"
          id="switchAuth"
          type="button"
        >
          Criar conta
        </button>

      </div>

    </form>


    <div style="margin-top:18px">

      <button
        class="link"
        id="forgotBtn"
        type="button"
      >
        Esqueci minha senha
      </button>

    </div>


    <div style="margin-top:20px">

      <button
        class="link"
        id="closeAuth"
        type="button"
      >
        Fechar
      </button>

    </div>

  </div>

</div>


<!-- RECUPERAÇÃO DE SENHA -->

<div class="modal" id="resetModal">

  <div class="modalbox">

    <h2>Nova senha</h2>

    <div id="resetMsg"></div>

    <form id="resetForm">

      <label>
        Nova senha<br>
        <input
          id="newPassword"
          type="password"
          minlength="6"
          required
        >
      </label>

      <div class="actions">

        <button
          class="btn"
          type="submit"
        >
          Salvar senha
        </button>

        <button
          class="link"
          id="closeReset"
          type="button"
        >
          Fechar
        </button>

      </div>

    </form>

  </div>

</div>


<!-- CONFIRMAÇÃO -->

<div class="modal" id="confirmModal">

  <div class="modalbox">

    <h2 id="confirmTitle">
      Confirmar
    </h2>

    <p id="confirmText"></p>

    <div class="actions">

      <button
        class="btn danger"
        id="confirmYes"
        type="button"
      >
        Confirmar
      </button>

      <button
        class="btn secondary"
        id="confirmNo"
        type="button"
      >
        Cancelar
      </button>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://qcgsuazwggixcqqduxwo.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_ZQTa-n4hxGN-jbP0WTuOrw_wew8DkO6";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let user = null;
let profile = null;
let categories = [];
let books = [];
let signupMode = false;
let confirmAction = null;


const $ = id =>
  document.getElementById(id);


const esc = s =>
  String(s ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c])
  );


function message(el,text,type=""){

  el.innerHTML = text
    ? `<div class="msg ${type}">${esc(text)}</div>`
    : "";

}


function isAdmin(){

  return (
    profile?.role === "admin" &&
    profile?.active !== false
  );

}


function openAuth(){

  $("authModal").classList.add("open");

  $("email").focus();

}


function closeAuth(){

  $("authModal").classList.remove("open");

  message(
    $("authMsg"),
    ""
  );

}


function showStatus(text,type=""){

  message(
    $("status"),
    text,
    type
  );

}


function showAdminStatus(text,type=""){

  message(
    $("adminStatus"),
    text,
    type
  );

}


function confirmBox(
  title,
  text,
  fn
){

  $("confirmTitle").textContent =
    title;

  $("confirmText").textContent =
    text;

  confirmAction = fn;

  $("confirmModal")
    .classList
    .add("open");

}


function closeConfirm(){

  confirmAction = null;

  $("confirmModal")
    .classList
    .remove("open");

}


async function loadProfile(){

  if(!user){

    profile = null;

    return;

  }


  const {
    data,
    error
  } = await db
    .from("profiles")
    .select(
      "id,email,full_name,role,active"
    )
    .eq("id",user.id)
    .maybeSingle();


  if(error){

    console.error(error);

    profile = null;

    return;

  }


  profile = data;

}


async function loadCategories(){

  const {
    data,
    error
  } = await db
    .from("categories")
    .select("id,name")
    .order("name");


  if(error){

    showStatus(
      "Não consegui carregar as coleções: " +
      error.message,
      "error"
    );

    return;

  }


  categories = data || [];


  $("categoryFilter").innerHTML =
    '<option value="">Todas as coleções</option>' +
    categories
      .map(
        c =>
          `<option value="${esc(c.id)}">
            ${esc(c.name)}
          </option>`
      )
      .join("");


  $("category").innerHTML =
    '<option value="">Sem coleção</option>' +
    categories
      .map(
        c =>
          `<option value="${esc(c.id)}">
            ${esc(c.name)}
          </option>`
      )
      .join("");

}


async function loadBooks(){

  const {
    data,
    error
  } = await db
    .from("books")
    .select(
      "id,title,author,isbn,edition,publication_year,description,category_id,categories(name)"
    )
    .order("title");


  if(error){

    showStatus(
      "Não consegui carregar os livros: " +
      error.message,
      "error"
    );

    return;

  }


  books = data || [];

  await renderBooks();

}


async function availableCount(bookId){

  const {
    count,
    error
  } = await db
    .from("book_copies")
    .select(
      "id",
      {
        count:"exact",
        head:true
      }
    )
    .eq("book_id",bookId)
    .eq("status","available");


  if(error){

    console.error(error);

    return 0;

  }


  return count || 0;

}


async function renderBooks(){

  const term =
    $("search")
      .value
      .trim()
      .toLowerCase();

  const cat =
    $("categoryFilter").value;


  const list =
    books.filter(
      b =>
        (
          !term ||
          `${b.title} ${b.author || ""}`
            .toLowerCase()
            .includes(term)
        ) &&
        (
          !cat ||
          String(b.category_id) === String(cat)
        )
    );


  if(!list.length){

    $("books").innerHTML =
      '<div class="panel">Nenhum livro encontrado.</div>';

    return;

  }


  $("books").innerHTML =
    list.map(
      b => `

      <article class="card">

        <div>

          <div class="meta">
            ${esc(b.categories?.name || "Acervo")}
          </div>

          <h3>
            ${esc(b.title)}
          </h3>

          <div class="meta">
            ${esc(
              b.author ||
              "Autor não informado"
            )}
          </div>

          <div
            class="meta"
            id="count-${b.id}"
            style="margin-top:12px"
          >
            Verificando exemplares...
          </div>

        </div>

        <div id="action-${b.id}"></div>

      </article>

      `
    ).join("");


  await Promise.all(

    list.map(
      async b => {

        const n =
          await availableCount(b.id);


        const countEl =
          $("count-" + b.id);

        const actionEl =
          $("action-" + b.id);


        if(countEl){

          countEl.textContent =
            n === 0
              ? "Nenhum exemplar disponível"
              : `${n} exemplar${n === 1 ? "" : "es"} disponível${n === 1 ? "" : "is"}`;

        }


        if(actionEl){

          if(user && n > 0){

            actionEl.innerHTML = `
              <button
                class="btn"
                type="button"
                onclick="borrowBook('${b.id}')"
              >
                Quero emprestar
              </button>
            `;

          }
          else if(user){

            actionEl.innerHTML = `
              <button
                class="btn secondary"
                type="button"
                disabled
              >
                Indisponível
              </button>
            `;

          }
          else{

            actionEl.innerHTML = `
              <button
                class="btn secondary"
                type="button"
                onclick="openAuth()"
              >
                Entrar para emprestar
              </button>
            `;

          }

        }

      }
    )

  );

}


async function borrowBook(bookId){

  if(!user){

    openAuth();

    return;

  }


  const {
    data:copy,
    error
  } = await db
    .from("book_copies")
    .select(
      "id,inventory_code"
    )
    .eq("book_id",bookId)
    .eq("status","available")
    .limit(1)
    .maybeSingle();


  if(error){

    showStatus(
      "Erro ao verificar exemplar: " +
      error.message,
      "error"
    );

    return;

  }


  if(!copy){

    showStatus(
      "Não há exemplar disponível deste livro.",
      "error"
    );

    await loadBooks();

    return;

  }


  const dueDate =
    new Date(
      Date.now() +
      14 * 86400000
    )
    .toISOString()
    .slice(0,10);


  const {
    data:loan,
    error:loanError
  } = await db
    .from("loans")
    .insert({
      user_id:user.id,
      copy_id:copy.id,
      due_date:dueDate,
      status:"active"
    })
    .select("id")
    .single();


  if(loanError){

    showStatus(
      "Não foi possível registrar o empréstimo: " +
      loanError.message,
      "error"
    );

    return;

  }


  const {
    error:updateError
  } = await db
    .from("book_copies")
    .update({
      status:"borrowed"
    })
    .eq("id",copy.id)
    .eq("status","available");


  if(updateError){

    await db
      .from("loans")
      .delete()
      .eq("id",loan.id);


    showStatus(
      "Não foi possível reservar o exemplar. Nenhuma alteração foi mantida.",
      "error"
    );

    return;

  }


  showStatus(
    "Empréstimo registrado. Exemplar " +
    copy.inventory_code +
    ".",
    "ok"
  );


  await loadBooks();

  await loadMyLoans();

}


async function loadMyLoans(){

  if(!user) return;


  const {
    data,
    error
  } = await db
    .from("loans")
    .select(
      "id,due_date,status,returned_at,book_copies(inventory_code,books(title,author))"
    )
    .eq("user_id",user.id)
    .order(
      "borrowed_at",
      {
        ascending:false
      }
    );


  if(error){

    $("myLoans").innerHTML =
      `<div class="panel">
        Erro: ${esc(error.message)}
      </div>`;

    return;

  }


  $("myLoans").innerHTML =
    (data || []).length

      ? data
          .map(
            l => `

            <article class="card">

              <div>

                <div class="meta">
                  ${
                    l.status === "active"
                      ? "Em empréstimo"
                      : "Devolvido"
                  }
                </div>

                <h3>
                  ${esc(
                    l.book_copies?.books?.title ||
                    "Livro"
                  )}
                </h3>

                <div class="meta">
                  Exemplar:
                  ${esc(
                    l.book_copies?.inventory_code ||
                    "—"
                  )}
                </div>

                <div class="meta">
                  Devolver à administração até:
                  ${esc(l.due_date || "—")}
                </div>

              </div>

            </article>

            `
          )
          .join("")

      : `
        <div class="panel">
          Você ainda não possui empréstimos.
        </div>
      `;

}


async function saveBook(e){

  e.preventDefault();


  if(!isAdmin()){

    showAdminStatus(
      "Você não tem permissão de administrador.",
      "error"
    );

    return;

  }


  const quantity =
    Math.max(
      1,
      parseInt(
        $("quantity").value,
        10
      ) || 1
    );


  const payload = {

    title:
      $("title")
        .value
        .trim(),

    author:
      $("author")
        .value
        .trim() || null,

    isbn:
      $("isbn")
        .value
        .trim() || null,

    edition:
      $("edition")
        .value
        .trim() || null,

    publication_year:
      $("year").value
        ? Number($("year").value)
        : null,

    description:
      $("description")
        .value
        .trim() || null,

    category_id:
      $("category").value || null

  };


  $("saveBookBtn").disabled =
    true;

  $("saveBookBtn").textContent =
    "Cadastrando...";


  try{

    const {
      data:book,
      error
    } = await db
      .from("books")
      .insert(payload)
      .select("id,title")
      .single();


    if(error)
      throw error;


    const prefix =
      String(book.id)
        .replace(/-/g,"")
        .slice(0,6)
        .toUpperCase();


    const copies =
      Array.from(
        {
          length:quantity
        },
        (_,i) => ({

          book_id:book.id,

          inventory_code:
            `CAR-${prefix}-${String(i+1).padStart(3,"0")}`,

          status:"available"

        })
      );


    const {
      error:copyError
    } = await db
      .from("book_copies")
      .insert(copies);


    if(copyError){

      await db
        .from("books")
        .delete()
        .eq("id",book.id);

      throw new Error(
        "Não foi possível criar os exemplares: " +
        copyError.message
      );

    }


    $("bookForm").reset();

    $("quantity").value = 1;


    showAdminStatus(
      `Livro cadastrado com ${quantity} exemplar${quantity === 1 ? "" : "es"}.`,
      "ok"
    );


    await loadBooks();

    await loadAdminBooks();


  }
  catch(err){

    showAdminStatus(
      err.message ||
      "Erro ao cadastrar livro.",
      "error"
    );

  }
  finally{

    $("saveBookBtn").disabled =
      false;

    $("saveBookBtn").textContent =
      "Cadastrar livro";

  }

}


async function loadAdminBooks(){

  if(!isAdmin())
    return;


  const {
    data,
    error
  } = await db
    .from("books")
    .select(
      "id,title,author,categories(name),book_copies(id,inventory_code,status)"
    )
    .order("title");


  if(error){

    $("adminBooks").innerHTML =
      `<div class="msg error">
        ${esc(error.message)}
      </div>`;

    return;

  }


  const borrowedCopyIds =
    (data || [])
      .flatMap(
        b =>
          (b.book_copies || [])
            .filter(
              c =>
                c.status === "borrowed"
            )
            .map(c => c.id)
      );


  let loans = [];


  if(borrowedCopyIds.length){

    const result =
      await db
        .from("loans")
        .select(
          "id,copy_id,user_id,due_date,borrowed_at,status,profiles(full_name,email)"
        )
        .in(
          "copy_id",
          borrowedCopyIds
        )
        .eq(
          "status",
          "active"
        );


    if(!result.error)
      loans = result.data || [];

  }


  const loanByCopy =
    Object.fromEntries(
      loans.map(
        l => [l.copy_id,l]
      )
    );


  $("adminBooks").innerHTML =
    (data || []).length

      ? data
          .map(
            b => {

              const copies =
                b.book_copies || [];


              const available =
                copies.filter(
                  c =>
                    c.status === "available"
                ).length;


              const borrowed =
                copies.filter(
                  c =>
                    c.status === "borrowed"
                ).length;


              return `

              <div class="admin-book">

                <div class="admin-row">

                  <div>

                    <strong>
                      ${esc(b.title)}
                    </strong>

                    <div class="meta">
                      ${esc(
                        b.author ||
                        "Autor não informado"
                      )}
                      ·
                      ${esc(
                        b.categories?.name ||
                        "Sem coleção"
                      )}
                    </div>

                    <div
                      style="margin-top:8px"
                    >

                      <span class="badge">
                        ${copies.length}
                        exemplar${copies.length === 1 ? "" : "es"}
                      </span>

                      <span class="badge">
                        ${available}
                        disponível${available === 1 ? "" : "is"}
                      </span>

                      ${
                        borrowed
                          ? `
                            <span class="badge borrowed">
                              ${borrowed}
                              emprestado${borrowed === 1 ? "" : "s"}
                            </span>
                          `
                          : ""
                      }

                    </div>

                  </div>


                  <button
                    class="btn danger"
                    type="button"
                    onclick="deleteBook('${b.id}')"
                  >
                    Excluir livro
                  </button>

                </div>


                <div class="copy-list">

                  ${
                    copies.length

                      ? copies
                          .map(
                            c => {

                              const loan =
                                loanByCopy[c.id];


                              return `

                              <div class="copy-item">

                                <div>

                                  <strong>
                                    ${esc(
                                      c.inventory_code
                                    )}
                                  </strong>

                                  <small>
                                    ·
                                    ${
                                      c.status === "available"
                                        ? "Disponível"
                                        : "Emprestado"
                                    }
                                  </small>

                                  ${
                                    loan
                                      ? `
                                        <br>

                                        <small>
                                          Com:
                                          ${esc(
                                            loan.profiles?.full_name ||
                                            loan.profiles?.email ||
                                            "usuário"
                                          )}

                                          · até
                                          ${esc(
                                            loan.due_date ||
                                            "—"
                                          )}
                                        </small>
                                      `
                                      : ""
                                  }

                                </div>


                                ${
                                  c.status === "borrowed"

                                    ? `
                                      <button
                                        class="btn secondary"
                                        type="button"
                                        onclick="adminReturn(
                                          '${c.id}',
                                          '${loan?.id || ""}'
                                        )"
                                      >
                                        Confirmar devolução
                                      </button>
                                    `

                                    : ""
                                }

                              </div>

                              `;

                            }
                          )
                          .join("")

                      : `
                        <div class="meta">
                          Nenhum exemplar cadastrado.
                        </div>
                      `
                  }

                </div>

              </div>

              `;

            }
          )
          .join("")

      : `
        <div class="panel">
          Nenhum livro cadastrado.
        </div>
      `;

}


async function adminReturn(
  copyId,
  loanId
){

  if(!isAdmin()){

    showAdminStatus(
      "Apenas administradores podem registrar devoluções.",
      "error"
    );

    return;

  }


  if(!loanId){

    showAdminStatus(
      "Não encontrei o empréstimo ativo deste exemplar.",
      "error"
    );

    return;

  }


  confirmBox(

    "Confirmar devolução",

    "Confirme somente depois que o livro físico tiver sido entregue à administração.",

    async () => {

      const {
        error:loanError
      } = await db
        .from("loans")
        .update({
          status:"returned",
          returned_at:
            new Date().toISOString()
        })
        .eq("id",loanId)
        .eq("status","active");


      if(loanError){

        showAdminStatus(
          "Não foi possível registrar a devolução: " +
          loanError.message,
          "error"
        );

        return;

      }


      const {
        error:copyError
      } = await db
        .from("book_copies")
        .update({
          status:"available"
        })
        .eq("id",copyId)
        .eq("status","borrowed");


      if(copyError){

        showAdminStatus(
          "O empréstimo foi encerrado, mas o exemplar não voltou a disponível: " +
          copyError.message,
          "error"
        );

        return;

      }


      showAdminStatus(
        "Devolução confirmada. O exemplar está novamente disponível para empréstimo.",
        "ok"
      );


      await loadBooks();

      await loadAdminBooks();

    }

  );

}


async function deleteBook(bookId){

  if(!isAdmin()){

    showAdminStatus(
      "Apenas administradores podem excluir livros.",
      "error"
    );

    return;

  }


  const {
    data:copies,
    error
  } = await db
    .from("book_copies")
    .select("id,status")
    .eq("book_id",bookId);


  if(error){

    showAdminStatus(
      "Não consegui verificar os exemplares: " +
      error.message,
      "error"
    );

    return;

  }


  if(
    (copies || [])
      .some(
        c =>
          c.status === "borrowed"
      )
  ){

    showAdminStatus(
      "Este livro não pode ser excluído enquanto houver exemplar emprestado. Primeiro registre a devolução.",
      "error"
    );

    return;

  }


  const copyIds =
    (copies || [])
      .map(c => c.id);


  if(copyIds.length){

    const {
      data:loans,
      error:loanError
    } = await db
      .from("loans")
      .select(
        "id,copy_id"
      )
      .in(
        "copy_id",
        copyIds
      );


    if(loanError){

      showAdminStatus(
        "Não consegui verificar o histórico: " +
        loanError.message,
        "error"
      );

      return;

    }


    if((loans || []).length){

      showAdminStatus(
        "Este livro possui histórico de empréstimos e não será apagado para preservar o histórico da biblioteca.",
        "error"
      );

      return;

    }

  }


  const book =
    books.find(
      b =>
        String(b.id) ===
        String(bookId)
    );


  confirmBox(

    "Excluir livro",

    `Excluir “${book?.title || "este livro"}” e todos os exemplares ainda sem histórico? Esta ação não pode ser desfeita.`,

    async () => {

      const {
        error:copyError
      } = await db
        .from("book_copies")
        .delete()
        .eq(
          "book_id",
          bookId
        );


      if(copyError){

        showAdminStatus(
          "Não foi possível excluir os exemplares: " +
          copyError.message,
          "error"
        );

        return;

      }


      const {
        error:bookError
      } = await db
        .from("books")
        .delete()
        .eq(
          "id",
          bookId
        );


      if(bookError){

        showAdminStatus(
          "Não foi possível excluir o livro: " +
          bookError.message,
          "error"
        );

        return;

      }


      showAdminStatus(
        "Livro excluído.",
        "ok"
      );


      await loadBooks();

      await loadAdminBooks();

    }

  );

}


function updateUI(){

  $("loginBtn")

}


async function authSubmit(e){

  e.preventDefault();


  const email =
    $("email")
      .value
      .trim();


  const password =
    $("password")
      .value;


  const fullName =
    $("fullName")
      .value
      .trim();


  $("authSubmit")
    .disabled = true;


  message(
    $("authMsg"),
    ""
  );


  try{

    if(signupMode){

      const {
        data,
        error
      } = await db.auth.signUp({

        email,

        password,

        options:{
          data:{
            full_name:fullName
          }
        }

      });


      if(error)
        throw error;


      if(!data.session){

        message(
          $("authMsg"),

          "Conta criada. Se a confirmação de e-mail estiver ativa no Supabase, confirme o e-mail antes de entrar.",

          "ok"
        );

      }
      else{

        closeAuth();

      }

    }
    else{

      const {
        error
      } =
        await db.auth
          .signInWithPassword({
            email,
            password
          });


      if(error)
        throw error;


      closeAuth();

    }

  }
  catch(err){

    message(
      $("authMsg"),
      err.message ||
      "Erro ao entrar.",
      "error"
    );

  }
  finally{

    $("authSubmit")
      .disabled = false;

    $("authSubmit")
      .textContent =
        signupMode
          ? "Criar conta"
          : "Entrar";

  }

}


async function forgot(){

  const email =
    $("email")
      .value
      .trim();


  if(!email){

    message(
      $("authMsg"),
      "Digite seu e-mail primeiro.",
      "error"
    );

    return;

  }


  const {
    error
  } =
    await db.auth
      .resetPasswordForEmail(
        email,
        {
          redirectTo:
            location.origin +
            location.pathname
        }
      );


  if(error){

    message(
      $("authMsg"),
      error.message,
      "error"
    );

    return;

  }


  message(
    $("authMsg"),
    "Enviamos o link de recuperação para seu e-mail.",
    "ok"
  );

}


async function resetPassword(e){

  e.preventDefault();


  const {
    error
  } =
    await db.auth
      .updateUser({
        password:
          $("newPassword").value
      });


  if(error){

    message(
      $("resetMsg"),
      error.message,
      "error"
    );

    return;

  }


  message(
    $("resetMsg"),
    "Senha alterada. Agora você pode entrar.",
    "ok"
  );

}

  await db.auth.signOut();

}
