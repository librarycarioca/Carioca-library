<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Carioca Library</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --green:#183b32;
  --green2:#245247;
  --cream:#f4f0e7;
  --paper:#fbfaf6;
  --ink:#18231f;
  --muted:#69726d;
  --line:#d8d4c9;
  --terra:#a9674d;
  --white:#ffffff;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:"DM Sans",sans-serif;
}

/* =========================
   HEADER
========================= */

header{
  height:76px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  background:rgba(251,250,246,.94);
  backdrop-filter:blur(10px);
  position:sticky;
  top:0;
  z-index:50;
}

.logo{
  font-family:"Bodoni Moda",serif;
  font-size:25px;
  color:var(--green);
}

nav{
  display:flex;
  gap:12px;
  align-items:center;
}

button{
  font:inherit;
  cursor:pointer;
}

.btn{
  border:0;
  background:var(--green);
  color:white;
  padding:11px 17px;
  border-radius:4px;
  transition:.2s;
}

.btn:hover{
  background:var(--green2);
  transform:translateY(-1px);
}

.btn.secondary{
  background:transparent;
  color:var(--green);
  border:1px solid var(--green);
}

.btn.danger{
  background:#7b4030;
}

.btn.danger:hover{
  background:#633225;
}

.btn:disabled{
  opacity:.55;
  cursor:not-allowed;
  transform:none;
}

/* =========================
   HERO
========================= */

.hero-wrap{
  position:relative;
  min-height:600px;
  display:flex;
  align-items:center;
  overflow:hidden;

  background-image:
    linear-gradient(
      90deg,
      rgba(244,240,231,.97) 0%,
      rgba(244,240,231,.92) 38%,
      rgba(244,240,231,.66) 65%,
      rgba(244,240,231,.30) 100%
    ),
    url("https://images.unsplash.com/photo-1521587760476-6c12a4b040da?auto=format&fit=crop&w=2200&q=85");

  background-size:cover;
  background-position:center;
}

.hero{
  position:relative;
  z-index:2;
  max-width:1180px;
  width:100%;
  margin:auto;
  padding:95px 5%;
}

.eyebrow{
  letter-spacing:.18em;
  text-transform:uppercase;
  font-size:11px;
  color:var(--terra);
  font-weight:600;
}

h1{
  font-family:"Bodoni Moda",serif;
  font-weight:500;
  font-size:clamp(50px,8vw,92px);
  line-height:.94;
  max-width:780px;
  margin:20px 0;
  color:var(--green);
}

.hero p{
  max-width:570px;
  color:#4e5b55;
  font-size:18px;
  line-height:1.75;
}

/* =========================
   MAIN
========================= */

main{
  max-width:1180px;
  margin:auto;
  padding:0 5% 80px;
}

section{
  padding-top:55px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:20px;
}

.section-title h2{
  font-family:"Bodoni Moda",serif;
  font-weight:500;
  font-size:36px;
  margin:0;
  color:var(--green);
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
  display:flex;
  gap:10px;
  margin:30px 0 25px;
}

.toolbar input{
  flex:1;
}

input,
select,
textarea{
  width:100%;
  padding:12px 13px;
  border:1px solid var(--line);
  border-radius:4px;
  background:#fff;
  color:var(--ink);
  font:inherit;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--green);
  box-shadow:0 0 0 2px rgba(24,59,50,.08);
}

/* =========================
   BOOK GRID
========================= */

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(245px,1fr));
  gap:20px;
}

.card{
  background:rgba(251,250,246,.96);
  border:1px solid var(--line);
  padding:23px;
  min-height:220px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 30px rgba(24,59,50,.08);
}

.card h3{
  font-family:"Bodoni Moda",serif;
  font-size:24px;
  line-height:1.15;
  font-weight:500;
  margin:7px 0 9px;
  color:var(--green);
}

.meta{
  font-size:13px;
  color:var(--muted);
  line-height:1.5;
}

.book-category{
  color:var(--terra);
  text-transform:uppercase;
  letter-spacing:.1em;
  font-size:10px;
  font-weight:600;
}

/* =========================
   PANELS
========================= */

.panel{
  background:rgba(251,250,246,.96);
  border:1px solid var(--line);
  padding:25px;
  margin-top:20px;
}

.panel h3{
  margin-top:0;
  font-family:"Bodoni Moda",serif;
  font-weight:500;
  font-size:25px;
  color:var(--green);
}

/* =========================
   FORM
========================= */

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.field.full{
  grid-column:1/-1;
}

label{
  font-size:13px;
  color:var(--muted);
}

label input,
label select,
label textarea{
  margin-top:6px;
}

/* =========================
   MESSAGES
========================= */

.msg{
  padding:13px 15px;
  margin:12px 0;
  border-radius:4px;
  font-size:14px;
  background:#eee9dc;
}

.msg.error{
  background:#f3ddd6;
  color:#713b2a;
}

.msg.ok{
  background:#dfece5;
  color:#234d3d;
}

/* =========================
   ADMIN
========================= */

.admin{
  border-top:1px solid var(--line);
  margin-top:55px;
  padding-top:40px;
}

.admin-book{
  padding:20px 0;
  border-bottom:1px solid var(--line);
}

.admin-book:last-child{
  border-bottom:0;
}

.admin-row{
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:center;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#e5e9e3;
  color:var(--green);
  font-size:12px;
  margin-right:5px;
}

.badge.borrowed{
  background:#f0ddd5;
  color:#713b2a;
}

.copy-list{
  margin-top:14px;
  padding-left:18px;
}

.copy-item{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  padding:10px 0;
  border-top:1px solid #e5e1d8;
  font-size:13px;
}

.copy-item small{
  color:var(--muted);
}

/* =========================
   TABLE
========================= */

table{
  width:100%;
  border-collapse:collapse;
  background:var(--paper);
}

th,
td{
  text-align:left;
  padding:13px;
  border-bottom:1px solid var(--line);
  font-size:14px;
}

th{
  font-weight:600;
  color:var(--green);
}

/* =========================
   MODALS
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(20,29,25,.58);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal.open{
  display:flex;
}

.modalbox{
  background:var(--paper);
  width:min(470px,100%);
  padding:30px;
  border:1px solid var(--line);
  box-shadow:0 25px 70px rgba(0,0,0,.2);
}

.modalbox h2{
  font-family:"Bodoni Moda",serif;
  font-weight:500;
  font-size:34px;
  margin:0 0 20px;
  color:var(--green);
}

.actions{
  display:flex;
  gap:10px;
  margin-top:17px;
  align-items:center;
  flex-wrap:wrap;
}

.link{
  border:0;
  background:none;
  color:var(--green);
  text-decoration:underline;
  padding:0;
}

/* =========================
   FOOTER
========================= */

footer{
  border-top:1px solid var(--line);
  padding:28px 6%;
  color:var(--muted);
  font-size:13px;
  background:var(--paper);
}

/* =========================
   UTILITIES
========================= */

.hidden{
  display:none!important;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  header{
    padding:0 5%;
    height:68px;
  }

  .logo{
    font-size:21px;
  }

  nav .hide-mobile{
    display:none;
  }

  .hero-wrap{
    min-height:540px;

    background-image:
      linear-gradient(
        rgba(244,240,231,.78),
        rgba(244,240,231,.94)
      ),
      url("https://images.unsplash.com/photo-1521587760476-6c12a4b040da?auto=format&fit=crop&w=1400&q=85");

    background-position:center;
  }

  .hero{
    padding:70px 5%;
  }

  h1{
    font-size:52px;
  }

  .hero p{
    font-size:16px;
  }

  .toolbar{
    flex-direction:column;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .admin-row{
    align-items:flex-start;
    flex-direction:column;
  }

  .copy-item{
    align-items:flex-start;
    flex-direction:column;
  }

}

/* =========================
   LARGE LIBRARY ATMOSPHERE
========================= */

.hero-wrap::after{
  content:"";
  position:absolute;
  right:0;
  top:0;
  width:45%;
  height:100%;

  background:
    linear-gradient(
      90deg,
      rgba(244,240,231,0),
      rgba(24,59,50,.05)
    );

  pointer-events:none;
}

</style>
</head>

<body>

<header>

  <div class="logo">
    Carioca Library
  </div>

  <nav>

    <button
      class="btn secondary hide-mobile"
      id="userLabel"
      type="button">
      Visitante
    </button>

    <button
      class="btn"
      id="loginBtn"
      type="button">
      Entrar
    </button>

    <button
      class="btn hidden"
      id="logoutBtn"
      type="button">
      Sair
    </button>

  </nav>

</header>


<main>

<!-- =========================
     HERO
========================= -->

<section class="hero-wrap">

  <div class="hero">

    <div class="eyebrow">
      Acervo da JOCUM Carioca
    </div>

    <h1>
      Ler, aprender e servir.
    </h1>

    <p>
      Um espaço para encontrar histórias,
      conhecimento e recursos.
    </p>

  </div>

</section>


<!-- =========================
     ACERVO
========================= -->

<section>

  <div class="section-title">
    <h2>Acervo</h2>
  </div>

  <div class="toolbar">

    <input
      id="search"
      placeholder="Buscar por título ou autor..."
    >

    <select id="categoryFilter">
      <option value="">
        Todas as coleções
      </option>
    </select>

  </div>

  <div id="status"></div>

  <div id="books" class="grid"></div>

</section>


<!-- =========================
     MEUS EMPRÉSTIMOS
========================= -->

<section
  id="myArea"
  class="hidden">

  <div class="section-title">
    <h2>Meus empréstimos</h2>
  </div>

  <div id="myLoans" class="grid"></div>

</section>


<!-- =========================
     ADMIN
========================= -->

<section
  id="adminArea"
  class="admin hidden">

  <div class="section-title">
    <h2>Administração</h2>
  </div>

  <div id="adminStatus"></div>


  <!-- CADASTRAR LIVRO -->

  <div class="panel">

    <h3>
      Adicionar livro
    </h3>

    <form id="bookForm">

      <div class="form-grid">

        <div class="field">

          <label>
            Título

            <input
              id="title"
              required
            >

          </label>

        </div>


        <div class="field">

          <label>
            Autor

            <input
              id="author"
            >

          </label>

        </div>


        <div class="field">

          <label>
            ISBN

            <input
              id="isbn"
            >

          </label>

        </div>


        <div class="field">

          <label>
            Edição

            <input
              id="edition"
            >

          </label>

        </div>


        <div class="field">

          <label>
            Ano

            <input
              id="year"
              type="number"
            >

          </label>

        </div>


        <div class="field">

          <label>
            Coleção

            <select id="category"></select>

          </label>

        </div>


        <div class="field">

          <label>
            Quantidade de exemplares

            <input
              id="quantity"
              type="number"
              min="1"
              value="1"
              required
            >

          </label>

        </div>


        <div class="field full">

          <label>
            Descrição

            <textarea
              id="description"
              rows="4"
            ></textarea>

          </label>

        </div>

      </div>


      <div class="actions">

        <button
          class="btn"
          id="saveBookBtn"
          type="submit">

          Cadastrar livro

        </button>

      </div>

    </form>

  </div>


  <!-- LIVROS ADMIN -->

  <div class="panel">

    <h3>
      Livros cadastrados
    </h3>

    <div id="adminBooks"></div>

  </div>

</section>

</main>


<footer>

  Uma biblioteca para ler, aprender e servir.

</footer>


<!-- =========================
     LOGIN
========================= -->

<div
  class="modal"
  id="authModal">

  <div class="modalbox">

    <h2 id="authTitle">
      Entrar
    </h2>

    <div id="authMsg"></div>

    <form id="authForm">

      <div
        id="nameField"
        class="hidden">

        <label>
          Nome

          <input
            id="fullName"
            autocomplete="name"
          >

        </label>

      </div>


      <div style="margin-top:12px">

        <label>
          E-mail

          <input
            id="email"
            type="email"
            required
            autocomplete="email"
          >

        </label>

      </div>


      <div style="margin-top:12px">

        <label>
          Senha

          <input
            id="password"
            type="password"
            required
            autocomplete="current-password"
          >

        </label>

      </div>


      <div class="actions">

        <button
          class="btn"
          id="authSubmit"
          type="submit">

          Entrar

        </button>

        <button
          class="link"
          id="switchAuth"
          type="button">

          Criar conta

        </button>

      </div>

    </form>


    <div style="margin-top:18px">

      <button
        class="link"
        id="forgotBtn"
        type="button">

        Esqueci minha senha

      </button>

    </div>


    <div style="margin-top:20px">

      <button
        class="link"
        id="closeAuth"
        type="button">

        Fechar

      </button>

    </div>

  </div>

</div>


<!-- =========================
     NOVA SENHA
========================= -->

<div
  class="modal"
  id="resetModal">

  <div class="modalbox">

    <h2>
      Nova senha
    </h2>

    <div id="resetMsg"></div>

    <form id="resetForm">

      <label>

        Nova senha

        <input
          id="newPassword"
          type="password"
          minlength="6"
          required
          autocomplete="new-password"
        >

      </label>

      <div class="actions">

        <button
          class="btn"
          type="submit">

          Salvar senha

        </button>

        <button
          class="link"
          id="closeReset"
          type="button">

          Fechar

        </button>

      </div>

    </form>

  </div>

</div>


<!-- =========================
     CONFIRMAÇÃO
========================= -->

<div
  class="modal"
  id="confirmModal">

  <div class="modalbox">

    <h2 id="confirmTitle">
      Confirmar
    </h2>

    <p id="confirmText"></p>

    <div class="actions">

      <button
        class="btn danger"
        id="confirmYes"
        type="button">

        Confirmar

      </button>

      <button
        class="btn secondary"
        id="confirmNo"
        type="button">

        Cancelar

      </button>

    </div>

  </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://qcgsuazwggixcqqduxwo.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_ZQTa-n4hxGN-jbP0WTuOrw_wew8DkO6";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   ESTADO
========================= */

let user = null;
let profile = null;
let categories = [];
let books = [];
let signupMode = false;
let confirmAction = null;


/* =========================
   HELPERS
========================= */

const $ = id =>
  document.getElementById(id);


const esc = value =>
  String(value ?? "")
    .replace(/[&<>"']/g, c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c]));


function message(
  element,
  text,
  type=""
){

  element.innerHTML =
    text
      ? `<div class="msg ${type}">
           ${esc(text)}
         </div>`
      : "";

}


function isAdmin(){

  return (
    profile?.role === "admin" &&
    profile?.active !== false
  );

}


/* =========================
   MODAIS
========================= */

function openAuth(){

  $("authModal")
    .classList
    .add("open");

  $("email").focus();

}


function closeAuth(){

  $("authModal")
    .classList
    .remove("open");

  message(
    $("authMsg"),
    ""
  );

}


function confirmBox(
  title,
  text,
  fn
){

  $("confirmTitle")
    .textContent = title;

  $("confirmText")
    .textContent = text;

  confirmAction = fn;

  $("confirmModal")
    .classList
    .add("open");

}


function closeConfirm(){

  confirmAction = null;

  $("confirmModal")
    .classList
    .remove("open");

}


function showStatus(
  text,
  type=""
){

  message(
    $("status"),
    text,
    type
  );

}


function showAdminStatus(
  text,
  type=""
){

  message(
    $("adminStatus"),
    text,
    type
  );

}


/* =========================
   PERFIL
========================= */

async function loadProfile(){

  if(!user){

    profile = null;
    return;

  }

  const {
    data,
    error
  } =
    await db
      .from("profiles")
      .select(
        "id,email,full_name,role,active"
      )
      .eq("id",user.id)
      .maybeSingle();

  if(error){

    console.error(error);

    profile = null;

    return;

  }

  profile = data;

}


/* =========================
   CATEGORIAS
========================= */

async function loadCategories(){

  const {
    data,
    error
  } =
    await db
      .from("categories")
      .select("id,name")
      .order("name");

  if(error){

    showStatus(
      "Não consegui carregar as coleções: " +
      error.message,
      "error"
    );

    return;

  }

  categories =
    data || [];


  $("categoryFilter")
    .innerHTML =
      '<option value="">Todas as coleções</option>' +

      categories
        .map(c =>
          `<option value="${esc(c.id)}">
             ${esc(c.name)}
           </option>`
        )
        .join("");


  $("category")
    .innerHTML =
      '<option value="">Sem coleção</option>' +

      categories
        .map(c =>
          `<option value="${esc(c.id)}">
             ${esc(c.name)}
           </option>`
        )
        .join("");

}


/* =========================
   LIVROS
========================= */

async function loadBooks(){

  const {
    data,
    error
  } =
    await db
      .from("books")
      .select(`
        id,
        title,
        author,
        isbn,
        edition,
        publication_year,
        description,
        category_id,
        categories(name)
      `)
      .order("title");

  if(error){

    showStatus(
      "Não consegui carregar os livros: " +
      error.message,
      "error"
    );

    return;

  }

  books =
    data || [];

  await renderBooks();

}


/* =========================
   EXEMPLARES DISPONÍVEIS
========================= */

async function availableCount(
  bookId
){

  const {
    count,
    error
  } =
    await db
      .from("book_copies")
      .select(
        "id",
        {
          count:"exact",
          head:true
        }
      )
      .eq("book_id",bookId)
      .eq("status","available");

  if(error){

    console.error(error);

    return 0;

  }

  return count || 0;

}


/* =========================
   RENDER LIVROS
========================= */

async function renderBooks(){

  const term =
    $("search")
      .value
      .trim()
      .toLowerCase();

  const category =
    $("categoryFilter").value;


  const list =
    books.filter(book => {

      const matchesSearch =
        !term ||
        `${book.title} ${book.author || ""}`
          .toLowerCase()
          .includes(term);

      const matchesCategory =
        !category ||
        String(book.category_id) ===
        String(category);

      return (
        matchesSearch &&
        matchesCategory
      );

    });


  if(!list.length){

    $("books").innerHTML =
      '<div class="panel">' +
      'Nenhum livro encontrado.' +
      '</div>';

    return;

  }


  $("books").innerHTML =
    list
      .map(book => `

        <article class="card">

          <div>

            <div class="book-category">
              ${esc(
                book.categories?.name ||
                "Acervo"
              )}
            </div>

            <h3>
              ${esc(book.title)}
            </h3>

            <div class="meta">
              ${esc(
                book.author ||
                "Autor não informado"
              )}
            </div>

            <div
              class="meta"
              id="count-${book.id}"
              style="margin-top:12px">

              Verificando exemplares...

            </div>

          </div>

          <div
            id="action-${book.id}">
          </div>

        </article>

      `)
      .join("");


  await Promise.all(

    list.map(
      async book => {

        const count =
          await availableCount(
            book.id
          );

        const countElement =
          $("count-" + book.id);

        const actionElement =
          $("action-" + book.id);


        if(countElement){

          countElement.textContent =
            count > 0
              ? `${count} exemplar${
                  count === 1
                    ? ""
                    : "es"
                } disponível${
                  count === 1
                    ? ""
                    : "is"
                }`
              : "Nenhum exemplar disponível";

        }


        if(!actionElement)
          return;


        if(!user){

          actionElement.innerHTML =
            `<button
               class="btn secondary"
               type="button"
               onclick="openAuth()">

               Entrar para emprestar

             </button>`;

          return;

        }


        if(count > 0){

          actionElement.innerHTML =
            `<button
               class="btn"
               type="button"
               onclick="borrowBook('${book.id}')">

               Quero emprestar

             </button>`;

        }else{

          actionElement.innerHTML =
            `<button
               class="btn secondary"
               type="button"
               disabled>

               Indisponível

             </button>`;

        }

      }
    )

  );

}


/* =========================
   EMPRÉSTIMO
========================= */

async function borrowBook(
  bookId
){

  if(!user){

    openAuth();

    return;

  }


  const {
    data:copy,
    error
  } =
    await db
      .from("book_copies")
      .select(
        "id,inventory_code"
      )
      .eq("book_id",bookId)
      .eq("status","available")
      .limit(1)
      .maybeSingle();


  if(error){

    showStatus(
      "Erro ao verificar exemplar: " +
      error.message,
      "error"
    );

    return;

  }


  if(!copy){

    showStatus(
      "Não há exemplar disponível deste livro.",
      "error"
    );

    await renderBooks();

    return;

  }


  const due =
    new Date(
      Date.now() +
      14 * 86400000
    )
      .toISOString()
      .slice(0,10);


  /*
    O empréstimo é criado primeiro.
    O banco precisa permitir essa operação
    para o usuário autenticado.
  */

  const {
    error:loanError
  } =
    await db
      .from("loans")
      .insert({

        user_id:user.id,

        copy_id:copy.id,

        due_date:due,

        status:"active"

      });


  if(loanError){

    showStatus(
      "Não foi possível registrar o empréstimo: " +
      loanError.message,
      "error"
    );

    return;

  }


  /*
    Depois o exemplar é marcado como emprestado.
  */

  const {
    error:copyError
  } =
    await db
      .from("book_copies")
      .update({
        status:"borrowed"
      })
      .eq("id",copy.id)
      .eq("status","available");


  if(copyError){

    showStatus(
      "O empréstimo foi criado, mas o exemplar não foi atualizado. Avise a administração.",
      "error"
    );

    return;

  }


  showStatus(
    "Empréstimo registrado. O livro deve ser entregue à administração.",
    "ok"
  );


  await loadBooks();

  await loadMyLoans();

}

/* =========================
   CADASTRAR LIVRO
========================= */

async function saveBook(event){

  event.preventDefault();


  if(!isAdmin()){

    showAdminStatus(
      "Você não tem permissão de administrador.",
      "error"
    );

    return;

  }


  const quantity =
    Math.max(
      1,
      parseInt(
        $("quantity").value,
        10
      ) || 1
    );


  const payload = {

    title:
      $("title")
        .value
        .trim(),

    author:
      $("author")
        .value
        .trim() ||
      null,

    isbn:
      $("isbn")
        .value
        .trim() ||
      null,

    edition:
      $("edition")
        .value
        .trim() ||
      null,

    publication_year:
      $("year").value
        ? Number(
            $("year").value
          )
        : null,

    description:
      $("description")
        .value
        .trim() ||
      null,

    category_id:
      $("category").value ||
      null

  };


  $("saveBookBtn").disabled = true;

  $("saveBookBtn").textContent =
    "Cadastrando...";


  try{

    const {
      data:book,
      error
    } =
      await db
        .from("books")
        .insert(payload)
        .select(
          "id,title"
        )
        .single();


    if(error)
      throw error;


    const prefix =
      String(book.id)
        .replace(/-/g,"")
        .slice(0,6)
        .toUpperCase();


    const copies =
      Array.from(
        {
          length:quantity
        },
        (_,index) => ({

          book_id:book.id,

          inventory_code:
            `CAR-${prefix}-${String(
              index + 1
            ).padStart(3,"0")}`,

          status:"available"

        })
      );


    const {
      error:copyError
    } =
      await db
        .from("book_copies")
        .insert(copies);


    if(copyError){

      await db
        .from("books")
        .delete()
        .eq(
          "id",
          book.id
        );

      throw new Error(
        "Não foi possível criar os exemplares: " +
        copyError.message
      );

    }


    $("bookForm").reset();

    $("quantity").value = 1;


    showAdminStatus(
      `Livro cadastrado com ${quantity} exemplar${
        quantity === 1
          ? ""
          : "es"
      }.`,
      "ok"
    );


    await loadBooks();

    await loadAdminBooks();


  }catch(error){

    showAdminStatus(
      error.message ||
      "Erro ao cadastrar livro.",
      "error"
    );

  }finally{

    $("saveBookBtn").disabled =
      false;

    $("saveBookBtn").textContent =
      "Cadastrar livro";

  }

}


/* =========================
   ADMIN LIVROS
========================= */

async function loadAdminBooks(){

  if(!isAdmin())
    return;


  const {
    data,
    error
  } =
    await db
      .from("books")
      .select(`
        id,
        title,
        author,
        categories(name),
        book_copies(
          id,
          inventory_code,
          status
        )
      `)
      .order("title");


  if(error){

    $("adminBooks").innerHTML =
      `<div class="msg error">
        ${esc(error.message)}
       </div>`;

    return;

  }


  const borrowedIds =
    (data || [])
      .flatMap(
        book =>
          (book.book_copies || [])
            .filter(
              copy =>
                copy.status ===
                "borrowed"
            )
            .map(
              copy =>
                copy.id
            )
      );


  let loans = [];


  if(borrowedIds.length){

    const result =
      await db
        .from("loans")
        .select(`
          id,
          copy_id,
          user_id,
          due_date,
          borrowed_at,
          status,
          profiles(
            full_name,
            email
          )
        `)
        .in(
          "copy_id",
          borrowedIds
        )
        .eq(
          "status",
          "active"
        );


    if(!result.error){

      loans =
        result.data || [];

    }

  }


  const loanByCopy =
    Object.fromEntries(
      loans.map(
        loan =>
          [
            loan.copy_id,
            loan
          ]
      )
    );


  if(!data?.length){

    $("adminBooks").innerHTML =
      `<div class="panel">
        Nenhum livro cadastrado.
       </div>`;

    return;

  }


  $("adminBooks").innerHTML =
    data
      .map(book => {

        const copies =
          book.book_copies || [];

        const available =
          copies.filter(
            c =>
              c.status ===
              "available"
          ).length;

        const borrowed =
          copies.filter(
            c =>
              c.status ===
              "borrowed"
          ).length;


        return `

          <div class="admin-book">

            <div class="admin-row">

              <div>

                <strong>
                  ${esc(book.title)}
                </strong>

                <div class="meta">

                  ${esc(
                    book.author ||
                    "Autor não informado"
                  )}

                  ·

                  ${esc(
                    book
                      .categories
                      ?.name ||
                    "Sem coleção"
                  )}

                </div>

                <div
                  style="margin-top:8px">

                  <span class="badge">

                    ${copies.length}
                    exemplar${
                      copies.length === 1
                        ? ""
                        : "es"
                    }

                  </span>

                  <span class="badge">

                    ${available}
                    disponível${
                      available === 1
                        ? ""
                        : "is"
                    }

                  </span>

                  ${
                    borrowed
                      ? `
                        <span
                          class="badge borrowed">

                          ${borrowed}
                          emprestado${
                            borrowed === 1
                              ? ""
                              : "s"
                          }

                        </span>
                      `
                      : ""
                  }

                </div>

              </div>

            </div>


            <div class="copy-list">

              ${
                copies.length

                  ? copies
                      .map(copy => {

                        const loan =
                          loanByCopy[
                            copy.id
                          ];


                        return `

                          <div
                            class="copy-item">

                            <div>

                              <strong>
                                ${esc(
                                  copy.inventory_code
                                )}
                              </strong>

                              <small>
                                ·

                                ${
                                  copy.status ===
                                  "available"

                                    ? "Disponível"

                                    : "Emprestado"
                                }

                              </small>


                              ${
                                loan
                                  ? `
                                    <br>

                                    <small>

                                      Com:
                                      ${esc(
                                        loan
                                          .profiles
                                          ?.full_name ||
                                        loan
                                          .profiles
                                          ?.email ||
                                        "usuário"
                                      )}

                                      · até
                                      ${esc(
                                        loan.due_date ||
                                        "—"
                                      )}

                                    </small>
                                  `
                                  : ""
                              }

                            </div>


                            ${
                              copy.status ===
                              "borrowed"

                                ? `
                                  <button
                                    class="btn secondary"
                                    type="button"
                                    onclick="adminReturn(
                                      '${copy.id}',
                                      '${loan?.id || ""}'
                                    )">

                                    Confirmar devolução

                                  </button>
                                `

                                : ""
                            }

                          </div>

                        `;

                      })
                      .join("")

                  : `
                    <div class="meta">
                      Nenhum exemplar cadastrado.
                    </div>
                  `
              }

            </div>

          </div>

        `;

      })
      .join("");

}


/* =========================
   DEVOLUÇÃO ADMIN
========================= */

async function adminReturn(
  copyId,
  loanId
){

  if(!isAdmin()){

    showAdminStatus(
      "Apenas administradores podem registrar devoluções.",
      "error"
    );

    return;

  }


  if(!loanId){

    showAdminStatus(
      "Não encontrei o empréstimo ativo deste exemplar.",
      "error"
    );

    return;

  }


  confirmBox(
    "Confirmar devolução",

    "Confirme somente depois que o livro físico tiver sido entregue à administração.",

    async () => {

      const {
        error:loanError
      } =
        await db
          .from("loans")
          .update({

            status:"returned",

            returned_at:
              new Date()
                .toISOString()

          })
          .eq(
            "id",
            loanId
          )
          .eq(
            "status",
            "active"
          );


      if(loanError){

        showAdminStatus(
          "Não foi possível registrar a devolução: " +
          loanError.message,
          "error"
        );

        return;

      }


      const {
        error:copyError
      } =
        await db
          .from("book_copies")
          .update({
            status:"available"
          })
          .eq(
            "id",
            copyId
          )
          .eq(
            "status",
            "borrowed"
          );


      if(copyError){

        showAdminStatus(
          "O empréstimo foi encerrado, mas o exemplar não voltou a disponível: " +
          copyError.message,
          "error"
        );

        return;

      }


      showAdminStatus(
        "Devolução confirmada. O exemplar está novamente disponível.",
        "ok"
      );


      await loadBooks();

      await loadAdminBooks();

    }

  );

}

}


/* =========================
   LOGIN / CADASTRO
========================= */

async function authSubmit(event){

  event.preventDefault();


  const email =
    $("email")
      .value
      .trim();

  const password =
    $("password")
      .value;

  const fullName =
    $("fullName")
      .value
      .trim();


  $("authSubmit").disabled =
    true;


  $("authSubmit")
    .textContent =
      signupMode
        ? "Criando..."
        : "Entrando...";


  message(
    $("authMsg"),
    ""
  );


  try{

    if(signupMode){

      const {
        data,
        error
      } =
        await db.auth.signUp({

          email,

          password,

          options:{
            data:{
              full_name:
                fullName
            }
          }

        });


      if(error)
        throw error;


      if(!data.session){

        message(
          $("authMsg"),

          "Conta criada. Verifique o e-mail se a confirmação estiver ativada.",

          "ok"
        );

      }else{

        closeAuth();

      }

    }else{

      const {
        error
      } =
        await db.auth
          .signInWithPassword({

            email,

            password

          });


      if(error)
        throw error;


      closeAuth();

    }

  }catch(error){

    message(
      $("authMsg"),

      error.message ||
      "Erro ao entrar.",

      "error"
    );

  }finally{

    $("authSubmit").disabled =
      false;

    $("authSubmit")
      .textContent =
        signupMode
          ? "Criar conta"
          : "Entrar";

  }

}


/* =========================
   ESQUECI SENHA
========================= */

async function forgot(){

  const email =
    $("email")
      .value
      .trim();


  if(!email){

    message(
      $("authMsg"),

      "Digite seu e-mail primeiro.",

      "error"
    );

    return;

  }


  const {
    error
  } =
    await db.auth
      .resetPasswordForEmail(
        email,
        {
          redirectTo:
            window.location.origin +
            window.location.pathname
        }
      );


  if(error){

    message(
      $("authMsg"),
      error.message,
      "error"
    );

    return;

  }


  message(
    $("authMsg"),

    "Enviamos o link de recuperação para seu e-mail.",

    "ok"
  );

}


/* =========================
   NOVA SENHA
========================= */

async function resetPassword(event){

  event.preventDefault();


  const newPassword =
    $("newPassword")
      .value;


  const {
    error
  } =
    await db.auth.updateUser({

      password:
        newPassword

    });


  if(error){

    message(
      $("resetMsg"),
      error.message,
      "error"
    );

    return;

  }


  message(
    $("resetMsg"),

    "Senha alterada com sucesso.",

    "ok"
  );

}

========================= */

db.auth.onAuthStateChange(
  async (
    event,
    session
  ) => {

    user =
      session?.user ||
      null;


    if(user)
      await loadProfile();

    else
      profile = null;


    /*
      IMPORTANTE:
      quando o link de recuperação
      for aberto, mostramos a tela
      de nova senha.
    */

    if(
      event ===
      "PASSWORD_RECOVERY"
    ){

      $("resetModal")
        .classList
        .add("open");

    }


    updateUI();

  }
);


/* =========================
   INICIALIZAÇÃO
========================= */

(async function start(){

  showStatus(
    "Carregando acervo..."
  );


  await loadCategories();

  await loadBooks();


  const {
    data
  } =
    await db.auth
      .getSession();


  user =
    data.session?.user ||
    null;


  if(user)
    await loadProfile();


  updateUI();


  showStatus("");


  /*
    Também detecta o retorno
    do link de recuperação.
  */

  if(
    window.location.hash
      .includes(
        "type=recovery"
      )
  ){

    setTimeout(
      () => {

        $("resetModal")
          .classList
          .add("open");

      },
      300
    );

  }

})();
