<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carioca Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --green:#183b32;
  --green2:#245247;
  --cream:#f4f0e7;
  --paper:#fbfaf6;
  --ink:#18231f;
  --muted:#69726d;
  --line:#d8d4c9;
  --terra:#a9674d
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:"DM Sans",sans-serif
}

header{
  height:76px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  background:rgba(251,250,246,.94);
  position:sticky;
  top:0;
  z-index:10
}

.logo{
  font-family:"Bodoni Moda",serif;
  font-size:25px;
  color:var(--green)
}

nav{
  display:flex;
  gap:18px;
  align-items:center
}

button{
  font:inherit;
  cursor:pointer
}

.btn{
  border:0;
  background:var(--green);
  color:#fff;
  padding:11px 17px;
  border-radius:4px
}

.btn:hover{
  background:var(--green2)
}

.btn.secondary{
  background:transparent;
  color:var(--green);
  border:1px solid var(--green)
}

main{
  max-width:1180px;
  margin:auto;
  padding:0 5% 70px
}

.hero{
  padding:75px 0 55px;
  border-bottom:1px solid var(--line)
}

.eyebrow{
  letter-spacing:.16em;
  text-transform:uppercase;
  font-size:11px;
  color:var(--terra)
}

h1{
  font-family:"Bodoni Moda",serif;
  font-weight:500;
  font-size:clamp(48px,8vw,88px);
  line-height:.95;
  max-width:780px;
  margin:17px 0
}

.hero p{
  max-width:600px;
  color:var(--muted);
  font-size:17px;
  line-height:1.7
}

.toolbar{
  display:flex;
  gap:10px;
  margin:35px 0 25px
}

.toolbar input{
  flex:1
}

input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:4px;
  background:#fff;
  color:var(--ink);
  font:inherit
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:18px
}

.card{
  background:var(--paper);
  border:1px solid var(--line);
  padding:22px;
  min-height:180px;
  display:flex;
  flex-direction:column;
  justify-content:space-between
}

.card h3{
  font-family:"Bodoni Moda",serif;
  font-size:23px;
  font-weight:500;
  margin:0 0 8px
}

.meta{
  font-size:13px;
  color:var(--muted)
}

section{
  padding-top:45px
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:18px
}

.section-title h2{
  font-family:"Bodoni Moda",serif;
  font-weight:500;
  font-size:34px;
  margin:0
}

.hidden{
  display:none!important
}

.panel{
  background:var(--paper);
  border:1px solid var(--line);
  padding:25px;
  margin-top:20px
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px
}

.field.full{
  grid-column:1/-1
}

.msg{
  padding:12px 14px;
  margin:12px 0;
  border-radius:4px;
  font-size:14px;
  background:#eee9dc
}

.msg.error{
  background:#f3ddd6;
  color:#713b2a
}

.msg.ok{
  background:#dfece5;
  color:#234d3d
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(20,29,25,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:30
}

.modal.open{
  display:flex
}

.modalbox{
  background:var(--paper);
  width:min(430px,100%);
  padding:30px;
  border:1px solid var(--line)
}

.modalbox h2{
  font-family:"Bodoni Moda",serif;
  font-weight:500;
  font-size:34px;
  margin:0 0 20px
}

.actions{
  display:flex;
  gap:10px;
  margin-top:15px;
  align-items:center
}

.link{
  border:0;
  background:none;
  color:var(--green);
  text-decoration:underline;
  padding:0
}

.admin{
  border-top:1px solid var(--line);
  margin-top:45px;
  padding-top:35px
}

table{
  width:100%;
  border-collapse:collapse;
  background:var(--paper)
}

th,td{
  text-align:left;
  padding:13px;
  border-bottom:1px solid var(--line);
  font-size:14px
}

th{
  font-weight:600;
  color:var(--green)
}

footer{
  border-top:1px solid var(--line);
  padding:25px 6%;
  color:var(--muted);
  font-size:13px
}

@media(max-width:650px){

  header{
    padding:0 5%;
    height:68px
  }

  .logo{
    font-size:21px
  }

  nav .hide-mobile{
    display:none
  }

  .hero{
    padding:50px 0 40px
  }

  .form-grid{
    grid-template-columns:1fr
  }

  .field.full{
    grid-column:auto
  }

  .toolbar{
    flex-direction:column
  }

}
</style>
</head>

<body>

<header>

  <div class="logo">
    Carioca Library
  </div>

  <nav>

    <button
      class="btn secondary hide-mobile"
      id="userLabel"
      type="button">
      Visitante
    </button>

    <button
      class="btn"
      id="loginBtn"
      type="button">
      Entrar
    </button>

    <button
      class="btn hidden"
      id="logoutBtn"
      type="button">
      Sair
    </button>

  </nav>

</header>


<main>

<section class="hero">

  <div class="eyebrow">
    Acervo da JOCUM Carioca
  </div>

  <h1>
    Ler, aprender e servir.
  </h1>

  <p>
    Um espaço para encontrar histórias, conhecimento e recursos.
  </p>

</section>


<section>

  <div class="section-title">
    <h2>Acervo</h2>
  </div>

  <div class="toolbar">

    <input
      id="search"
      placeholder="Buscar por título ou autor...">

    <select id="categoryFilter">
      <option value="">
        Todas as coleções
      </option>
    </select>

  </div>

  <div id="status"></div>

  <div
    id="books"
    class="grid">
  </div>

</section>


<section
  id="myArea"
  class="hidden">

  <div class="section-title">
    <h2>Meus empréstimos</h2>
  </div>

  <div
    id="myLoans"
    class="grid">
  </div>

</section>


<section
  id="adminArea"
  class="admin hidden">

  <div class="section-title">
    <h2>Administração</h2>
  </div>

  <div id="adminStatus"></div>


  <div class="panel">

    <h3>
      Adicionar livro
    </h3>

    <form id="bookForm">

      <div class="form-grid">

        <div class="field">

          <label>
            Título<br>

            <input
              id="title"
              required>

          </label>

        </div>


        <div class="field">

          <label>
            Autor<br>

            <input
              id="author">

          </label>

        </div>


        <div class="field">

          <label>
            ISBN<br>

            <input
              id="isbn">

          </label>

        </div>


        <div class="field">

          <label>
            Edição<br>

            <input
              id="edition">

          </label>

        </div>


        <div class="field">

          <label>
            Ano<br>

            <input
              id="year"
              type="number">

          </label>

        </div>


        <div class="field">

          <label>
            Coleção<br>

            <select id="category"></select>

          </label>

        </div>


        <div class="field full">

          <label>
            Descrição<br>

            <textarea
              id="description"
              rows="4"></textarea>

          </label>

        </div>

      </div>


      <div class="actions">

        <button
          class="btn"
          type="submit">

          Cadastrar livro

        </button>

      </div>

    </form>

  </div>


  <div class="panel">

    <h3>
      Livros cadastrados
    </h3>

    <div id="adminBooks"></div>

  </div>

</section>

</main>


<footer>
  Uma biblioteca para ler, aprender e servir.
</footer>


<!-- LOGIN -->

<div
  class="modal"
  id="authModal">

  <div class="modalbox">

    <h2 id="authTitle">
      Entrar
    </h2>

    <div id="authMsg"></div>


    <form id="authForm">

      <div
        id="nameField"
        class="hidden">

        <label>
          Nome<br>

          <input id="fullName">

        </label>

      </div>


      <div style="margin-top:12px">

        <label>
          E-mail<br>

          <input
            id="email"
            type="email"
            required
            autocomplete="email">

        </label>

      </div>


      <div style="margin-top:12px">

        <label>
          Senha<br>

          <input
            id="password"
            type="password"
            required
            autocomplete="current-password">

        </label>

      </div>


      <div class="actions">

        <button
          class="btn"
          id="authSubmit"
          type="submit">

          Entrar

        </button>


        <button
          class="link"
          id="switchAuth"
          type="button">

          Criar conta

        </button>

      </div>

    </form>


    <div style="margin-top:18px">

      <button
        class="link"
        id="forgotBtn"
        type="button">

        Esqueci minha senha

      </button>

    </div>


    <div style="margin-top:20px">

      <button
        class="link"
        id="closeAuth"
        type="button">

        Fechar

      </button>

    </div>

  </div>

</div>


<!-- RECUPERAÇÃO -->

<div
  class="modal"
  id="resetModal">

  <div class="modalbox">

    <h2>
      Nova senha
    </h2>

    <div id="resetMsg"></div>


    <form id="resetForm">

      <label>

        Nova senha<br>

        <input
          id="newPassword"
          type="password"
          minlength="6"
          required>

      </label>


      <div class="actions">

        <button
          class="btn"
          type="submit">

          Salvar senha

        </button>


        <button
          class="link"
          id="closeReset"
          type="button">

          Fechar

        </button>

      </div>

    </form>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://qcgsuazwggixcqqduxwo.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_ZQTa-n4hxGN-jbP0WTuOrw_wew8DkO6";


const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let user = null;

let profile = null;

let categories = [];

let books = [];

let signupMode = false;


const $ =
  id => document.getElementById(id);


const esc =
  s =>
    String(s ?? "")
      .replace(
        /[&<>"']/g,
        c =>
          ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
          }[c])
      );


function message(
  el,
  text,
  type=""
){

  el.innerHTML =
    text
      ? `<div class="msg ${type}">
          ${esc(text)}
        </div>`
      : "";

}


function isAdmin(){

  return (
    profile?.role === "admin" &&
    profile?.active !== false
  );

}


function openAuth(){

  $("authModal").classList.add("open");

  $("email").focus();

}


function closeAuth(){

  $("authModal").classList.remove("open");

  message(
    $("authMsg"),
    ""
  );

}


function showStatus(
  text,
  type=""
){

  message(
    $("status"),
    text,
    type
  );

}


function showAdminStatus(
  text,
  type=""
){

  message(
    $("adminStatus"),
    text,
    type
  );

}


async function loadProfile(){

  if(!user){

    profile = null;

    return;

  }


  const {
    data,
    error
  } =
    await db
      .from("profiles")
      .select(
        "id,email,full_name,role,active"
      )
      .eq("id",user.id)
      .maybeSingle();


  if(error){

    console.error(error);

    profile = null;

    return;

  }


  profile = data;

}


async function loadCategories(){

  const {
    data,
    error
  } =
    await db
      .from("categories")
      .select("id,name")
      .order("name");


  if(error){

    showStatus(
      "Não consegui carregar as coleções: " +
      error.message,
      "error"
    );

    return;

  }


  categories = data || [];


  $("categoryFilter").innerHTML =
    '<option value="">Todas as coleções</option>' +

    categories
      .map(
        c =>
          `<option value="${esc(c.id)}">
            ${esc(c.name)}
          </option>`
      )
      .join("");


  $("category").innerHTML =
    '<option value="">Sem coleção</option>' +

    categories
      .map(
        c =>
          `<option value="${esc(c.id)}">
            ${esc(c.name)}
          </option>`
      )
      .join("");

}


async function loadBooks(){

  const q =
    db
      .from("books")
      .select(
        "id,title,author,isbn,edition,publication_year,description,category_id,categories(name)"
      )
      .order("title");


  const {
    data,
    error
  } = await q;


  if(error){

    showStatus(
      "Não consegui carregar os livros: " +
      error.message,
      "error"
    );

    return;

  }


  books = data || [];

  renderBooks();

}


function renderBooks(){

  const term =
    $("search")
      .value
      .trim()
      .toLowerCase();


  const cat =
    $("categoryFilter").value;


  const list =
    books.filter(
      b =>

        (
          !term ||

          `${b.title} ${b.author || ""}`
            .toLowerCase()
            .includes(term)
        )

        &&

        (
          !cat ||
          b.category_id === cat
        )

    );


  $("books").innerHTML =

    list.length

      ?

      list
        .map(
          b => `

            <article class="card">

              <div>

                <div class="meta">
                  ${esc(
                    b.categories?.name ||
                    "Acervo"
                  )}
                </div>

                <h3>
                  ${esc(b.title)}
                </h3>

                <div class="meta">
                  ${esc(
                    b.author ||
                    "Autor não informado"
                  )}
                </div>

              </div>


              ${
                user

                ?

                `<button
                  class="btn"
                  type="button"
                  onclick="borrowBook('${b.id}')">

                  Quero emprestar

                </button>`

                :

                `<button
                  class="btn secondary"
                  type="button"
                  onclick="openAuth()">

                  Entrar para emprestar

                </button>`
              }

            </article>

          `
        )
        .join("")

      :

      `<div class="panel">
        Nenhum livro encontrado.
      </div>`;

}


async function borrowBook(
  bookId
){

  if(!user){

    openAuth();

    return;

  }


  const {
    data:copy,
    error:ce
  } =
    await db
      .from("book_copies")
      .select("id")
      .eq("book_id",bookId)
      .eq("status","available")
      .limit(1)
      .maybeSingle();


  if(ce){

    showStatus(
      "Erro ao verificar exemplares: " +
      ce.message,
      "error"
    );

    return;

  }


  if(!copy){

    showStatus(
      "Não há exemplar disponível deste livro.",
      "error"
    );

    return;

  }


  const due =
    new Date(
      Date.now() +
      14 * 86400000
    )
    .toISOString()
    .slice(0,10);


  const {
    error:le
  } =
    await db
      .from("loans")
      .insert({

        user_id:user.id,

        copy_id:copy.id,

        due_date:due,

        status:"active"

      });


  if(le){

    showStatus(
      "Não foi possível registrar o empréstimo: " +
      le.message,
      "error"
    );

    return;

  }


  const {
    error:ue
  } =
    await db
      .from("book_copies")
      .update({
        status:"borrowed"
      })
      .eq("id",copy.id);


  if(ue){

    showStatus(
      "O empréstimo foi criado, mas o exemplar não foi atualizado. Avise a administração.",
      "error"
    );

    return;

  }


  showStatus(
    "Empréstimo registrado.",
    "ok"
  );


  await loadBooks();

  await loadMyLoans();

}


async function loadMyLoans(){

  if(!user) return;


  const {
    data,
    error
  } =
    await db
      .from("loans")
      .select(
        "id,due_date,status,returned_at,book_copies(inventory_code,books(title,author))"
      )
      .eq(
        "user_id",
        user.id
      )
      .order(
        "borrowed_at",
        {
          ascending:false
        }
      );


  if(error){

    $("myLoans").innerHTML =
      `<div class="panel">
        Erro: ${esc(error.message)}
      </div>`;

    return;

  }


  $("myLoans").innerHTML =

    (data || []).length

      ?

      (data || [])
        .map(
          l => `

            <article class="card">

              <div>

                <div class="meta">
                  ${esc(l.status)}
                </div>

                <h3>
                  ${esc(
                    l.book_copies?.books?.title ||
                    "Livro"
                  )}
                </h3>

                <div class="meta">
                  Devolver até:
                  ${esc(
                    l.due_date || "—"
                  )}
                </div>

              </div>


              ${
                l.status === "active"

                ?

                `<button
                  class="btn secondary"
                  type="button"
                  onclick="returnBook('${l.id}')">

                  Marcar devolvido

                </button>`

                :

                ""
              }

            </article>

          `
        )
        .join("")

      :

      `<div class="panel">
        Você ainda não possui empréstimos.
      </div>`;

}


async function returnBook(
  loanId
){

  const {
    data:loan,
    error
  } =
    await db
      .from("loans")
      .select(
        "id,copy_id"
      )
      .eq(
        "id",
        loanId
      )
      .eq(
        "user_id",
        user.id
      )
      .maybeSingle();


  if(error || !loan){

    showStatus(
      "Não encontrei esse empréstimo.",
      "error"
    );

    return;

  }


  const {
    error:le
  } =
    await db
      .from("loans")
      .update({

        status:"returned",

        returned_at:
          new Date().toISOString()

      })
      .eq(
        "id",
        loanId
      );


  if(le){

    showStatus(
      "Não foi possível registrar a devolução: " +
      le.message,
      "error"
    );

    return;

  }


  const {
    error:ce
  } =
    await db
      .from("book_copies")
      .update({
        status:"available"
      })
      .eq(
        "id",
        loan.copy_id
      );


  if(ce){

    showStatus(
      "Devolução registrada, mas o exemplar precisa ser conferido pela administração.",
      "error"
    );

    return;

  }


  showStatus(
    "Devolução registrada.",
    "ok"
  );


  await loadBooks();

  await loadMyLoans();

}


async function saveBook(e){

  e.preventDefault();


  if(!isAdmin()){

    showAdminStatus(
      "Você não tem permissão de administrador.",
      "error"
    );

    return;

  }


  const payload = {

    title:
      $("title")
        .value
        .trim(),

    author:
      $("author")
        .value
        .trim() ||
      null,

    isbn:
      $("isbn")
        .value
        .trim() ||
      null,

    edition:
      $("edition")
        .value
        .trim() ||
      null,

    publication_year:
      $("year").value
        ?
        Number(
          $("year").value
        )
        :
        null,

    description:
      $("description")
        .value
        .trim() ||
      null,

    category_id:
      $("category").value ||
      null

  };


  const {
    data,
    error
  } =
    await db
      .from("books")
      .insert(payload)
      .select(
        "id,title"
      )
      .single();


  if(error){

    showAdminStatus(
      "Não foi possível cadastrar o livro: " +
      error.message,
      "error"
    );

    return;

  }


  $("bookForm").reset();


  showAdminStatus(
    "Livro cadastrado: " +
    data.title,
    "ok"
  );


  await loadBooks();

  await loadAdminBooks();

}


async function loadAdminBooks(){

  if(!isAdmin()) return;


  const {
    data,
    error
  } =
    await db
      .from("books")
      .select(
        "id,title,author,category_id,categories(name)"
      )
      .order("title");


  if(error){

    $("adminBooks").innerHTML =
      `<div class="msg error">
        ${esc(error.message)}
      </div>`;

    return;

  }


  $("adminBooks").innerHTML = `

    <table>

      <thead>

        <tr>

          <th>
            Livro
          </th>

          <th>
            Autor
          </th>

          <th>
            Coleção
          </th>

        </tr>

      </thead>


      <tbody>

        ${
          (data || [])
            .map(
              b => `

                <tr>

                  <td>
                    ${esc(b.title)}
                  </td>

                  <td>
                    ${esc(
                      b.author ||
                      "—"
                    )}
                  </td>

                  <td>
                    ${esc(
                      b.categories?.name ||
                      "—"
                    )}
                  </td>

                </tr>

              `
            )
            .join("")
        }

      </tbody>

    </table>

  `;

}


function updateUI(){

  $("loginBtn")
    .classList
    .toggle(
      "hidden",
      !!user
    );


  $("logoutBtn")
    .classList
    .toggle(
      "hidden",
      !user
    );


  $("userLabel")
    .textContent =
      user
        ?
        (
          profile?.full_name ||
          user.email
        )
        :
        "Visitante";


  $("myArea")
    .classList
    .toggle(
      "hidden",
      !user
    );


  $("adminArea")
    .classList
    .toggle(
      "hidden",
      !isAdmin()
    );


  if(user)
    loadMyLoans();


  if(isAdmin())
    loadAdminBooks();

}


async function authSubmit(e){

  e.preventDefault();


  const email =
    $("email")
      .value
      .trim();


  const password =
    $("password")
      .value;


  const fullName =
    $("fullName")
      .value
      .trim();


  $("authSubmit")
    .disabled = true;


  $("authSubmit")
    .textContent =
      "Entrando...";


  message(
    $("authMsg"),
    ""
  );


  try{

    let result;


    if(signupMode){

      result =
        await db.auth.signUp({

          email,

          password,

          options:{
            data:{
              full_name:
                fullName
            }
          }

        });


      if(result.error)
        throw result.error;


      if(!result.data.session){

        message(
          $("authMsg"),

          "Conta criada. Se a confirmação de e-mail estiver ativa no Supabase, confirme o e-mail antes de entrar.",

          "ok"
        );

      }

      else{

        message(
          $("authMsg"),
          "Conta criada.",
          "ok"
        );

        closeAuth();

      }

    }

    else{

      result =
        await db.auth.signInWithPassword({

          email,

          password

        });


      if(result.error)
        throw result.error;


      closeAuth();

    }

  }

  catch(err){

    message(
      $("authMsg"),

      err.message ||
      "Erro ao entrar.",

      "error"
    );

  }

  finally{

    $("authSubmit")
      .disabled = false;


    $("authSubmit")
      .textContent =
        signupMode
          ?
          "Criar conta"
          :
          "Entrar";

  }

}


async function forgot(){

  const email =
    $("email")
      .value
      .trim();


  if(!email){

    message(
      $("authMsg"),

      "Digite seu e-mail primeiro.",

      "error"
    );

    return;

  }


  const {
    error
  } =
    await db.auth.resetPasswordForEmail(

      email,

      {
        redirectTo:
          location.origin +
          location.pathname
      }

    );


  if(error){

    message(
      $("authMsg"),
      error.message,
      "error"
    );

    return;

  }


  message(
    $("authMsg"),

    "Enviamos o link de recuperação para seu e-mail.",

    "ok"
  );

}


async function resetPassword(e){

  e.preventDefault();


  const {
    error
  } =
    await db.auth.updateUser({

      password:
        $("newPassword")
          .value

    });


  if(error){

    message(
      $("resetMsg"),
      error.message,
      "error"
    );

    return;

  }


  message(
    $("resetMsg"),

    "Senha alterada. Agora você pode entrar.",

    "ok"
  );

}


async function logout(){

  await db.auth.signOut();

}


$("loginBtn")
  .addEventListener(
    "click",
    openAuth
  );


$("logoutBtn")
  .addEventListener(
    "click",
    logout
  );


$("closeAuth")
  .addEventListener(
    "click",
    closeAuth
  );


$("authForm")
  .addEventListener(
    "submit",
    authSubmit
  );


$("forgotBtn")
  .addEventListener(
    "click",
    forgot
  );


$("switchAuth")
  .addEventListener(
    "click",
    () => {

      signupMode =
        !signupMode;


      $("authTitle")
        .textContent =
          signupMode
            ?
            "Criar conta"
            :
            "Entrar";


      $("authSubmit")
        .textContent =
          signupMode
            ?
            "Criar conta"
            :
            "Entrar";


      $("nameField")
        .classList
        .toggle(
          "hidden",
          !signupMode
        );


      $("switchAuth")
        .textContent =
          signupMode
            ?
            "Já tenho uma conta"
            :
            "Criar conta";

    }
  );


$("bookForm")
  .addEventListener(
    "submit",
    saveBook
  );


$("search")
  .addEventListener(
    "input",
    renderBooks
  );


$("categoryFilter")
  .addEventListener(
    "change",
    renderBooks
  );


$("closeReset")
  .addEventListener(
    "click",
    () =>
      $("resetModal")
        .classList
        .remove("open")
  );


$("resetForm")
  .addEventListener(
    "submit",
    resetPassword
  );


db.auth.onAuthStateChange(
  async (
    _event,
    session
  ) => {

    user =
      session?.user ||
      null;


    if(user)
      await loadProfile();

    else
      profile = null;


    updateUI();


    if(user)
      await loadMyLoans();

  }
);


(async function start(){

  showStatus(
    "Carregando acervo..."
  );


  await loadCategories();

  await loadBooks();


  const {
    data
  } =
    await db.auth.getSession();


  user =
    data.session?.user ||
    null;


  if(user)
    await loadProfile();


  updateUI();


  showStatus("");


  if(
    location.hash.includes(
      "type=recovery"
    )
  ){

    $("resetModal")
      .classList
      .add("open");

  }

})();

</script>
