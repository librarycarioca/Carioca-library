<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Carioca Library — JOCUM Carioca</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --green:#173b32;
      --green-dark:#102d26;
      --green-soft:#31584d;
      --cream:#f5f0e7;
      --paper:#fbf9f4;
      --white:#ffffff;
      --terracotta:#a9674f;
      --terracotta-dark:#8d513c;
      --ink:#1f2824;
      --muted:#68736e;
      --line:#ddd7cc;
      --shadow:0 18px 50px rgba(23,59,50,.08);
      --radius:18px;
    }

    *{
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      background:var(--paper);
      color:var(--ink);
      font-family:"DM Sans",sans-serif;
    }

    button,
    input,
    select,
    textarea{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    .container{
      width:min(1180px,calc(100% - 40px));
      margin:0 auto;
    }

    /* =========================================================
       HEADER
    ========================================================= */

    header{
      position:sticky;
      top:0;
      z-index:50;
      background:rgba(251,249,244,.95);
      backdrop-filter:blur(14px);
      border-bottom:1px solid rgba(221,215,204,.8);
    }

    .nav{
      min-height:78px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:25px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:13px;
    }

    .brand-mark{
      width:42px;
      height:42px;
      border:1px solid var(--green);
      display:grid;
      place-items:center;
      color:var(--green);
      font-family:"Bodoni Moda",serif;
      font-size:22px;
      line-height:1;
    }

    .brand-text{
      display:flex;
      flex-direction:column;
      gap:1px;
    }

    .brand-title{
      font-family:"Bodoni Moda",serif;
      font-size:19px;
      color:var(--green);
    }

    .brand-subtitle{
      font-size:10px;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:var(--muted);
    }

    .nav-actions{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .nav-user{
      color:var(--muted);
      font-size:13px;
      display:none;
    }

    .btn{
      border:1px solid transparent;
      min-height:44px;
      padding:0 18px;
      border-radius:999px;
      transition:.2s ease;
      font-weight:600;
      font-size:14px;
    }

    .btn-primary{
      background:var(--green);
      color:#fff;
    }

    .btn-primary:hover{
      background:var(--green-dark);
      transform:translateY(-1px);
    }

    .btn-outline{
      border-color:var(--green);
      color:var(--green);
      background:transparent;
    }

    .btn-outline:hover{
      background:var(--green);
      color:#fff;
    }

    .btn-terra{
      background:var(--terracotta);
      color:#fff;
    }

    .btn-terra:hover{
      background:var(--terracotta-dark);
    }

    .btn-small{
      min-height:38px;
      padding:0 14px;
      font-size:13px;
    }

    .hidden{
      display:none !important;
    }

    /* =========================================================
       HERO
    ========================================================= */

    .hero{
      padding:55px 0 35px;
    }

    .hero-grid{
      display:grid;
      grid-template-columns:1.03fr .97fr;
      min-height:540px;
      background:var(--cream);
      overflow:hidden;
    }

    .hero-copy{
      padding:70px 60px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      position:relative;
    }

    .eyebrow{
      color:var(--terracotta);
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.18em;
      font-weight:700;
      margin-bottom:18px;
    }

    .hero h1{
      font-family:"Bodoni Moda",serif;
      font-weight:500;
      font-size:clamp(48px,6vw,78px);
      line-height:.95;
      color:var(--green);
      margin:0 0 25px;
      max-width:600px;
    }

    .hero-description{
      max-width:560px;
      font-size:17px;
      line-height:1.75;
      color:#59645f;
      margin:0 0 30px;
    }

    .hero-identification{
      margin-top:18px;
      padding-top:20px;
      border-top:1px solid var(--line);
      font-size:13px;
      letter-spacing:.1em;
      text-transform:uppercase;
      color:var(--green);
      font-weight:600;
    }

    .hero-image{
      position:relative;
      min-height:540px;
      background:
        linear-gradient(
          180deg,
          rgba(16,45,38,.05),
          rgba(16,45,38,.28)
        ),
        url("https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=1400&q=
        <script>
    /* =========================================================
       AUTENTICAÇÃO
    ========================================================= */

    function showAuth(mode = "login") {
      authMode = mode;

      $("authTitle").textContent =
        mode === "login" ? "Entrar" : "Criar conta";

      $("authDescription").textContent =
        mode === "login"
          ? "Entre para consultar seus empréstimos e solicitar livros."
          : "Crie sua conta para participar da biblioteca.";

      $("nameGroup").style.display =
        mode === "login" ? "none" : "block";

      $("authName").required = mode !== "login";

      $("authSubmit").textContent =
        mode === "login" ? "Entrar" : "Criar conta";

      $("switchText").textContent =
        mode === "login"
          ? "Ainda não possui uma conta?"
          : "Já possui uma conta?";

      $("switchAuth").textContent =
        mode === "login"
          ? "Criar conta"
          : "Entrar";

      $("forgotPassword").style.display =
        mode === "login" ? "block" : "none";

      $("authModal").classList.add("open");
    }

    function closeAuth() {
      $("authModal").classList.remove("open");
    }

    $("openLogin").addEventListener("click", () => {
      showAuth("login");
    });

    $("closeAuth").addEventListener("click", closeAuth);

    $("switchAuth").addEventListener("click", () => {
      showAuth(
        authMode === "login"
          ? "signup"
          : "login"
      );
    });

    $("authForm").addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        const email =
          $("authEmail").value.trim();

        const password =
          $("authPassword").value;

        if (!email || !password) {
          showToast(
            "Preencha e-mail e senha.",
            true
          );
          return;
        }

        if (authMode === "signup") {

          const name =
            $("authName").value.trim();

          if (!name) {
            showToast(
              "Informe seu nome.",
              true
            );
            return;
          }

          const {
            data,
            error
          } = await db.auth.signUp({
            email,
            password,
            options: {
              data: {
                full_name: name
              }
            }
          });

          if (error) {
            showToast(
              error.message,
              true
            );
            return;
          }

          if (data.user) {
            showToast(
              "Conta criada com sucesso!"
            );
          }

          $("authForm").reset();

          closeAuth();

          await loadSession();

          return;
        }

        const {
          error
        } = await db.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          showToast(
            "Não foi possível entrar: " +
            error.message,
            true
          );
          return;
        }

        $("authForm").reset();

        closeAuth();

        await loadSession();

        showToast(
          "Login realizado com sucesso."
        );
      }
    );


    /* =========================================================
       SAIR
    ========================================================= */

    $("logoutBtn").addEventListener(
      "click",
      async () => {

        const {
          error
        } = await db.auth.signOut();

        if (error) {
          showToast(
            error.message,
            true
          );
          return;
        }

        currentUser = null;
        currentProfile = null;

        renderUserArea();

        await loadBooks();

        await loadUserLoans();

        showToast(
          "Você saiu da sua conta."
        );
      }
    );


    /* =========================================================
       RECUPERAÇÃO DE SENHA
    ========================================================= */

    $("forgotPassword").addEventListener(
      "click",
      async event => {

        event.preventDefault();

        const email =
          $("authEmail").value.trim();

        if (!email) {
          showToast(
            "Digite seu e-mail primeiro.",
            true
          );
          return;
        }

        const {
          error
        } = await db.auth.resetPasswordForEmail(
          email,
          {
            redirectTo:
              window.location.origin +
              window.location.pathname
          }
        );

        if (error) {
          showToast(
            error.message,
            true
          );
          return;
        }

        showToast(
          "Enviamos um link para redefinir sua senha."
        );
      }
    );


    /* =========================================================
       NOVA SENHA
    ========================================================= */

    async function checkPasswordRecovery() {

      const hash =
        window.location.hash || "";

      if (
        hash.includes("type=recovery")
      ) {

        $("passwordModal").classList.add(
          "open"
        );
      }
    }

    $("passwordForm").addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        const password =
          $("newPassword").value;

        const confirmPassword =
          $("confirmPassword").value;

        if (password.length < 6) {
          showToast(
            "A senha precisa ter pelo menos 6 caracteres.",
            true
          );
          return;
        }

        if (
          password !== confirmPassword
        ) {
          showToast(
            "As senhas não coincidem.",
            true
          );
          return;
        }

        const {
          error
        } = await db.auth.updateUser({
          password
        });

        if (error) {
          showToast(
            error.message,
            true
          );
          return;
        }

        $("passwordModal").classList.remove(
          "open"
        );

        showToast(
          "Senha atualizada com sucesso."
        );
      }
    );


    /* =========================================================
       SESSÃO
    ========================================================= */

    async function loadSession() {

      const {
        data,
        error
      } = await db.auth.getSession();

      if (error) {
        console.error(error);
        return;
      }

      currentUser =
        data.session?.user || null;

      if (currentUser) {

        const {
          data: profile,
          error: profileError
        } = await db
          .from("profiles")
          .select("*")
          .eq("id", currentUser.id)
          .maybeSingle();

        if (profileError) {
          console.error(
            profileError
          );
        }

        currentProfile =
          profile || null;

      } else {

        currentProfile = null;
      }

      renderUserArea();

      await loadUserLoans();

      if (
        currentProfile?.role === "admin"
      ) {

        $("adminPanel").classList.add(
          "visible"
        );

        await loadAdminLoans();

        await loadAdminUsers();

      } else {

        $("adminPanel").class.remove(
          "visible"
        );
      }
    }


    /* =========================================================
       ÁREA DO USUÁRIO
    ========================================================= */

    function renderUserArea() {

      const userArea =
        $("userArea");

      if (!userArea) return;

      if (!currentUser) {

        userArea.innerHTML = `
          <button
            class="primary-button"
            id="loginHeaderButton">
            Entrar
          </button>
        `;

        $("loginHeaderButton")
          .addEventListener(
            "click",
            () => showAuth("login")
          );

        return;
      }

      const name =
        currentProfile?.full_name ||
        currentUser.email ||
        "Usuário";

      const role =
        currentProfile?.role === "admin"
          ? "Administrador"
          : "Usuário";

      userArea.innerHTML = `
        <div class="user-name">
          ${escapeHTML(name)}
          <span>${role}</span>
        </div>

        <button
          class="secondary-button"
          id="logoutBtn">
          Sair
        </button>
      `;

      $("logoutBtn").addEventListener(
        "click",
        async () => {

          await db.auth.signOut();

          currentUser = null;
          currentProfile = null;

          renderUserArea();

          await loadUserLoans();

          showToast(
            "Você saiu da sua conta."
          );
        }
      );
    }


    /* =========================================================
       EMPRÉSTIMOS DO USUÁRIO
    ========================================================= */

    async function loadUserLoans() {

      const container =
        $("userLoans");

      if (!container) return;

      if (!currentUser) {

        container.innerHTML = `
          <p class="empty-message">
            Entre na sua conta para visualizar seus empréstimos.
          </p>
        `;

        return;
      }

      const {
        data,
        error
      } = await db
        .from("loans")
        .select(`
          id,
          borrowed_at,
          due_date,
          returned_at,
          status,
          book_copies (
            inventory_code,
            books (
              id,
              title,
              author,
              cover_url
            )
          )
        `)
        .eq(
          "user_id",
          currentUser.id
        )
        .order(
          "borrowed_at",
          {
            ascending: false
          }
        );

      if (error) {

        console.error(error);

        container.innerHTML = `
          <p class="empty-message">
            Não foi possível carregar seus empréstimos.
          </p>
        `;

        return;
      }

      if (!data || !data.length) {

        container.innerHTML = `
          <p class="empty-message">
            Você ainda não possui empréstimos.
          </p>
        `;

        return;
      }

      container.innerHTML =
        data.map(loan => {

          const book =
            loan.book_copies?.books;

          const status =
            loan.status === "returned"
              ? "Devolvido"
              : loan.status === "overdue"
                ? "Atrasado"
                : "Emprestado";

          return `
            <article class="loan-card">

              <div class="loan-card-info">

                <h4>
                  ${escapeHTML(
                    book?.title ||
                    "Livro"
                  )}
                </h4>

                <p>
                  ${escapeHTML(
                    book?.author ||
                    "Autor não informado"
                  )}
                </p>

                <small>
                  Exemplar:
                  ${escapeHTML(
                    loan.book_copies?.inventory_code ||
                    "—"
                  )}
                </small>

              </div>

              <div class="loan-card-status">

                <span class="loan-status">
                  ${status}
                </span>

                <small>
                  Devolução:
                  ${
                    loan.due_date
                      ? formatDate(
                          loan.due_date
                        )
                      : "—"
                  }
                </small>

              </div>

            </article>
          `;
        }).join("");
    }


    /* =========================================================
       EMPRÉSTIMO — USUÁRIO
       SOMENTE O SISTEMA RESERVA O EXEMPLAR.
       O USUÁRIO NÃO DEVOLVE PELO SITE.
    ========================================================= */

    window.borrowBook =
      async function(bookId) {

        if (!currentUser) {

          showAuth("login");

          return;
        }

        const confirmed =
          confirm(
            "Deseja solicitar este livro para empréstimo?"
          );

        if (!confirmed) return;

        const {
          data,
          error
        } = await db.rpc(
          "borrow_book",
          {
            p_book_id: bookId
          }
        );

        if (error) {

          showToast(
            "Não foi possível registrar o empréstimo: " +
            error.message,
            true
          );

          return;
        }

        if (!data) {

          showToast(
            "Não foi possível registrar o empréstimo.",
            true
          );

          return;
        }

        showToast(
          "Empréstimo registrado com sucesso. Entregue o livro ao administrador."
        );

        await loadBooks();

        await loadUserLoans();

        if (
          currentProfile?.role === "admin"
        ) {

          await loadAdminLoans();
        }
      };


    /* =========================================================
       ADMIN — ADICIONAR LIVRO
    ========================================================= */

    $("adminBookForm").addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        if (
          currentProfile?.role !== "admin"
        ) {

          showToast(
            "Apenas administradores podem adicionar livros.",
            true
          );

          return;
        }

        const quantity =
          Math.max(
            1,
            Number(
              $("bookQuantity").value || 1
            )
          );

        const payload = {

          p_title:
            $("bookTitle")
              .value
              .trim(),

          p_author:
            $("bookAuthor")
              .value
              .trim
